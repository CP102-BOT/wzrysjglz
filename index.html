<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀世界 · 攻略站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060B12;
            --bg: #0D1520;
            --bg-card: #111A27;
            --bg-hover: #172231;
            --bg-elevated: #1A2535;
            --text: #EFF2F6;
            --text2: #8496AD;
            --text3: #5A6D85;
            --gold: #C8922A;
            --gold2: #E2AC3F;
            --gold-bg: rgba(200,146,42,0.08);
            --gold-glow: rgba(200,146,42,0.15);
            --red: #D9434E;
            --red2: #F0606A;
            --red-bg: rgba(217,67,78,0.08);
            --cyan: #2E9EC4;
            --cyan2: #46B8DE;
            --cyan-bg: rgba(46,158,196,0.07);
            --green: #3DA35D;
            --green2: #52C072;
            --border: rgba(132,150,173,0.08);
            --border2: rgba(132,150,173,0.14);
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --t: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:var(--font);background:var(--bg-deep);color:var(--text);
            line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;
        }

        /* ── 背景纹理 ── */
        body::before{
            content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 17.3v34.6L30 69.3 0 51.9V17.3z' fill='none' stroke='%23C8922A' stroke-width='0.5' opacity='0.02'/%3E%3C/svg%3E") repeat,
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200,146,42,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 35% 35% at 75% 45%, rgba(46,158,196,0.03) 0%, transparent 50%),
                radial-gradient(ellipse 30% 25% at 20% 75%, rgba(217,67,78,0.02) 0%, transparent 50%);
        }

        ::-webkit-scrollbar{width:4px;height:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(132,150,173,0.15);border-radius:2px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(132,150,173,0.3)}

        /* ═══════ HEADER ═══════ */
        .header{
            position:sticky;top:0;z-index:100;
            background:rgba(13,21,32,0.88);
            backdrop-filter:blur(18px) saturate(150%);
            -webkit-backdrop-filter:blur(18px) saturate(150%);
            border-bottom:1px solid var(--border);
        }
        .h-inner{
            max-width:1400px;margin:0 auto;padding:0 1.5rem;
            display:flex;justify-content:space-between;align-items:center;
            height:56px;gap:1rem;
        }
        .logo{
            font-size:1rem;font-weight:800;color:var(--gold2);
            display:flex;align-items:center;gap:.5rem;letter-spacing:.02em;
            white-space:nowrap;
        }
        .logo svg{width:28px;height:28px;flex-shrink:0}
        .h-nav{display:flex;gap:2px}
        .h-nav a{
            display:flex;align-items:center;gap:.4rem;
            padding:.45rem .85rem;border-radius:.4rem;cursor:pointer;
            text-decoration:none;color:var(--text2);font-size:.85rem;
            font-weight:600;transition:var(--t);position:relative;
        }
        .h-nav a svg{width:17px;height:17px;flex-shrink:0;opacity:.6}
        .h-nav a:hover{color:var(--text);background:var(--bg-hover)}
        .h-nav a:hover svg{opacity:1}
        .h-nav a.active{color:var(--gold2);background:var(--gold-bg)}
        .h-nav a.active svg{opacity:1;color:var(--gold2)}
        .h-nav a.active::after{
            content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
            width:55%;height:2px;background:var(--gold);border-radius:1px;
        }
        .h-acts{display:flex;gap:.4rem;align-items:center}
        .btn-icon{
            width:36px;height:36px;border-radius:.4rem;
            border:1px solid var(--border);background:var(--bg-card);
            color:var(--text2);cursor:pointer;font-size:1rem;
            display:flex;align-items:center;justify-content:center;transition:var(--t);
            position:relative;
        }
        .btn-icon:hover{color:var(--gold2);border-color:rgba(200,146,42,0.3);background:var(--bg-hover)}
        .btn-icon .dot{
            position:absolute;top:5px;right:5px;width:6px;height:6px;
            border-radius:50%;background:var(--red);display:none;
        }
        .btn-icon .dot.show{display:block}
        .hamburger{
            display:none;background:none;border:1px solid var(--border);
            color:var(--text);font-size:1.2rem;cursor:pointer;
            width:36px;height:36px;border-radius:.4rem;
            align-items:center;justify-content:center;
        }

        /* ═══════ PVP MODE TABS (LOL-style sub-nav) ═══════ */
        .mode-tabs{
            max-width:1400px;margin:1.25rem auto 0;padding:0 1.5rem;
            display:flex;gap:0;border-bottom:1px solid var(--border);
            overflow-x:auto;-webkit-overflow-scrolling:touch;
        }
        .mode-tab{
            display:flex;align-items:center;gap:.45rem;
            padding:.6rem 1.15rem;cursor:pointer;white-space:nowrap;
            color:var(--text2);font-size:.88rem;font-weight:600;
            border-bottom:2px solid transparent;transition:var(--t);
            font-family:var(--font);
        }
        .mode-tab svg{width:18px;height:18px;opacity:.55;flex-shrink:0}
        .mode-tab:hover{color:var(--text)}
        .mode-tab:hover svg{opacity:.85}
        .mode-tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
        .mode-tab.active svg{opacity:1;color:var(--gold2)}
        .mode-tab .tip{
            font-size:.65rem;padding:.1rem .4rem;border-radius:.2rem;
            font-weight:700;letter-spacing:.04em;line-height:1.4;
        }
        .tip-new{background:rgba(61,163,93,0.12);color:var(--green2)}
        .tip-hot{background:rgba(217,67,78,0.12);color:var(--red2)}

        /* ═══════ HERO BANNER ═══════ */
        .hero-section{max-width:1400px;margin:1.25rem auto;padding:0 1.5rem}
        .hero-banner{
            border-radius:var(--radius-lg);overflow:hidden;position:relative;
            background:linear-gradient(135deg,#0c1420 0%,#111a27 35%,#0d1622 65%,#0c1420 100%);
            border:1px solid var(--border2);min-height:200px;
        }
        .hero-banner::before{
            content:'';position:absolute;inset:0;z-index:0;
            background:
                radial-gradient(circle at 20% 30%,rgba(200,146,42,0.08),transparent 50%),
                radial-gradient(circle at 80% 60%,rgba(46,158,196,0.06),transparent 40%);
        }
        .hero-slide{
            display:none;padding:2rem 2.5rem;align-items:center;gap:2rem;
            position:relative;z-index:1;animation:slideIn .35s ease;
        }
        @keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .hero-slide.active{display:flex}
        .hero-av{
            width:96px;height:96px;border-radius:.6rem;
            background:linear-gradient(135deg,var(--bg-card),var(--bg-elevated));
            display:flex;align-items:center;justify-content:center;
            font-size:2.5rem;flex-shrink:0;border:1px solid var(--border2);
            box-shadow:0 4px 20px rgba(0,0,0,0.4);
        }
        .hero-info{flex:1;min-width:0}
        .hero-info h2{font-size:1.3rem;font-weight:800;margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
        .hero-badge{font-size:.65rem;padding:.15rem .5rem;border-radius:.25rem;font-weight:700;letter-spacing:.03em}
        .hero-badge.hot{background:var(--red-bg);color:var(--red2);border:1px solid rgba(217,67,78,0.25)}
        .hero-badge.new{background:rgba(61,163,93,0.1);color:var(--green2);border:1px solid rgba(61,163,93,0.2)}
        .hero-info .sub{color:var(--text2);font-size:.84rem;margin-bottom:.4rem}
        .hero-info .desc{color:var(--text2);font-size:.83rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .hero-tags{display:flex;gap:.35rem;margin-top:.65rem;flex-wrap:wrap}
        .hero-tag{padding:.18rem .6rem;border-radius:.25rem;font-size:.73rem;font-weight:500;border:1px solid rgba(200,146,42,0.2);color:var(--gold2);background:var(--gold-bg)}
        .hero-dots{display:flex;gap:.4rem;justify-content:center;padding:.75rem;position:relative;z-index:1}
        .hero-dot{width:8px;height:8px;border-radius:50%;cursor:pointer;background:var(--border2);transition:var(--t)}
        .hero-dot.active{background:var(--gold);width:22px;border-radius:4px}

        /* ═══════ CODE BANNER ═══════ */
        .cb-wrap{max-width:1400px;margin:0 auto 1rem;padding:0 1.5rem}
        .cb-inner{
            background:linear-gradient(135deg,rgba(200,146,42,0.08),rgba(200,146,42,0.03));
            border:1px solid rgba(200,146,42,0.15);border-radius:var(--radius);
            padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
        }
        .cb-inner .cb-icon{font-size:1.5rem;flex-shrink:0}
        .cb-inner .cb-info{flex:1;min-width:180px}
        .cb-inner .cb-title{font-weight:700;font-size:.88rem;color:var(--gold2);margin-bottom:.15rem}
        .cb-codes{display:flex;gap:.5rem;flex-wrap:wrap}
        .code-tag{
            padding:.32rem .7rem;border-radius:.3rem;
            background:rgba(200,146,42,0.1);border:1px solid rgba(200,146,42,0.25);
            font-family:'SF Mono','Menlo',monospace;font-size:.85rem;
            color:var(--gold2);cursor:pointer;transition:var(--t);font-weight:600;
        }
        .code-tag:hover{background:rgba(200,146,42,0.2);box-shadow:0 0 0 1px rgba(200,146,42,0.2),0 2px 12px rgba(200,146,42,0.1)}
        .code-tag .reward{display:block;font-size:.66rem;color:var(--text2);font-weight:400;font-family:var(--font)}

        /* ═══════ SEARCH + FILTERS ═══════ */
        .search-wrap{max-width:1400px;margin:0 auto .85rem;padding:0 1.5rem}
        .search-box{max-width:480px;margin:0 auto;position:relative}
        .search-input{
            width:100%;padding:.65rem 1rem .65rem 2.6rem;
            border-radius:.4rem;border:1px solid var(--border2);
            background:var(--bg-card);color:var(--text);
            font-size:.88rem;font-family:var(--font);outline:none;transition:var(--t);
        }
        .search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,146,42,0.08)}
        .search-input::placeholder{color:var(--text3)}
        .search-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.95rem;pointer-events:none}
        .filter-wrap{
            max-width:1400px;margin:0 auto 1rem;padding:0 1.5rem;
            display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;
        }
        .filter-label{color:var(--text3);font-size:.78rem;margin-right:.2rem}
        .filter-tag{
            padding:.28rem .75rem;border-radius:1rem;cursor:pointer;
            border:1px solid var(--border);background:var(--bg-card);
            color:var(--text2);font-size:.78rem;transition:var(--t);font-weight:500;
        }
        .filter-tag:hover{border-color:var(--border2);color:var(--text)}
        .filter-tag.active{background:var(--gold-bg);color:var(--gold2);border-color:rgba(200,146,42,0.3)}

        /* ═══════ HOME TABS ═══════ */
        .home-sections{max-width:1400px;margin:0 auto;padding:0 1.5rem}
        .hs-tabs{display:flex;gap:0;margin-bottom:1rem;border-bottom:1px solid var(--border)}
        .hs-tab{
            padding:.5rem 1.2rem;cursor:pointer;color:var(--text2);
            font-size:.9rem;font-weight:600;border-bottom:2px solid transparent;
            transition:var(--t);font-family:var(--font);display:flex;align-items:center;gap:.4rem;
        }
        .hs-tab:hover{color:var(--text)}
        .hs-tab.active{color:var(--gold2);border-bottom-color:var(--gold)}

        /* ═══════ SECTION ═══════ */
        .sec-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
        .sec-title{font-size:1.05rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:.5rem}
        .sec-title::before{content:'';width:3px;height:1.05rem;background:var(--gold);border-radius:2px}
        .sec-count{color:var(--text3);font-size:.78rem}

        .main-content{max-width:1400px;margin:0 auto 3rem;padding:0 1.5rem}

        /* ═══════ DATA RANKING SECTION ═══════ */
        .rank-section{max-width:1400px;margin:0 auto 1.5rem;padding:0 1.5rem}
        .rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
        .rank-card{
            background:var(--bg-card);border:1px solid var(--border);
            border-radius:var(--radius);padding:1.25rem;transition:var(--t);
            position:relative;overflow:hidden;
        }
        .rank-card:hover{border-color:var(--border2);background:var(--bg-hover)}
        .rank-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,transparent,var(--gold),transparent);
            opacity:0;transition:opacity .3s;
        }
        .rank-card:hover::before{opacity:1}
        .rank-card .rk-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
        .rank-card .rk-title{font-weight:700;font-size:.88rem;color:var(--text2)}
        .rank-card .rk-icon{font-size:1.3rem}
        .rank-item{
            display:flex;align-items:center;gap:.65rem;padding:.45rem 0;
            border-bottom:1px solid var(--border);transition:var(--t);
        }
        .rank-item:last-child{border-bottom:none}
        .rank-item:hover{background:rgba(200,146,42,0.03);margin:0 -.5rem;padding:.45rem .5rem;border-radius:.3rem}
        .rank-num{
            width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0;
            background:var(--bg);color:var(--text3);
        }
        .rank-num.top1{background:rgba(200,146,42,0.2);color:var(--gold2)}
        .rank-num.top2{background:rgba(132,150,173,0.15);color:var(--text2)}
        .rank-num.top3{background:rgba(200,146,42,0.08);color:var(--gold)}
        .rank-info{flex:1;min-width:0}
        .rank-info .rn{font-size:.84rem;font-weight:700;color:var(--text)}
        .rank-info .rp{font-size:.72rem;color:var(--text3)}
        .rank-bar-wrap{width:60px;height:4px;background:var(--border);border-radius:2px;flex-shrink:0;overflow:hidden}
        .rank-bar{height:100%;border-radius:2px;background:var(--gold);transition:width .6s ease}

        /* ═══════ GRID ═══════ */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem}
        @media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:1450px){.grid{grid-template-columns:repeat(4,1fr)}}

        /* ═══════ CARD ═══════ */
        .card{
            background:var(--bg-card);border:1px solid var(--border);
            border-radius:var(--radius);cursor:pointer;transition:var(--t);
            overflow:hidden;display:flex;flex-direction:column;position:relative;
        }
        .card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:var(--shadow)}
        .card-img{
            height:165px;background:var(--bg-elevated);display:flex;
            align-items:center;justify-content:center;font-size:2.8rem;
            position:relative;overflow:hidden;
        }
        .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
        .card:hover .card-img img{transform:scale(1.04)}
        .card-img .play-ov{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.3);opacity:0;transition:opacity .3s;z-index:3;
        }
        .card[data-vid]:hover .play-ov{opacity:1}
        .play-btn{
            width:44px;height:44px;border-radius:50%;background:rgba(200,146,42,0.85);
            color:#fff;display:flex;align-items:center;justify-content:center;
            font-size:1.1rem;backdrop-filter:blur(4px);
        }
        .card-badge{
            position:absolute;top:.55rem;left:.55rem;
            padding:.18rem .5rem;border-radius:.25rem;
            font-size:.67rem;font-weight:700;z-index:4;letter-spacing:.03em;
        }
        .bg-new{background:var(--green);color:#fff}
        .bg-hot{background:var(--red);color:#fff}
        .bg-vid{
            position:absolute;bottom:.55rem;right:.55rem;
            padding:.18rem .45rem;border-radius:.25rem;
            font-size:.67rem;font-weight:600;z-index:4;
            background:rgba(0,0,0,0.75);color:#fff;
            display:flex;align-items:center;gap:.2rem;backdrop-filter:blur(4px);
        }
        .card-body{padding:1rem 1.1rem 1.1rem;flex:1;display:flex;flex-direction:column}
        .card-title{font-size:.92rem;font-weight:700;margin-bottom:.25rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
        .card-title span{flex:1;min-width:0}
        .card-fav{background:none;border:none;cursor:pointer;font-size:1rem;padding:.1rem .25rem;transition:var(--t);flex-shrink:0;opacity:.35;color:var(--red2)}
        .card-fav:hover,.card-fav.active{opacity:1}
        .card-meta{color:var(--text3);font-size:.76rem;margin-bottom:.35rem}
        .card-tags{display:flex;gap:.25rem;flex-wrap:wrap;margin-bottom:.4rem}
        .card-tag{
            padding:.12rem .45rem;border-radius:.2rem;
            background:var(--cyan-bg);color:var(--cyan2);
            font-size:.7rem;font-weight:500;border:1px solid rgba(46,158,196,0.12);
        }
        .card-desc{
            color:var(--text2);font-size:.8rem;line-height:1.5;margin-top:auto;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
        }

        /* ═══════ ACCORDION ═══════ */
        .accordion{display:flex;flex-direction:column;gap:.55rem}
        .acc-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
        .acc-hdr{padding:.95rem 1.15rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.9rem;transition:var(--t)}
        .acc-hdr:hover{background:var(--bg-hover)}
        .acc-hdr .arr{transition:var(--t);color:var(--text3);font-size:.7rem}
        .acc-item.open .acc-hdr .arr{transform:rotate(180deg);color:var(--gold2)}
        .acc-body{display:none;padding:0 1.15rem 1.15rem}
        .acc-item.open .acc-body{display:block}
        .acc-body ul{list-style:none}
        .acc-body li{padding:.4rem 0;border-bottom:1px solid var(--border);color:var(--text2);font-size:.82rem}
        .acc-body li::before{content:'\2022';color:var(--gold);margin-right:.55rem}
        .acc-body li:last-child{border-bottom:none}

        /* ═══════ MODAL ═══════ */
        .modal-overlay{
            position:fixed;inset:0;background:rgba(6,11,18,0.85);
            display:none;align-items:center;justify-content:center;
            z-index:1000;padding:1rem;backdrop-filter:blur(6px);
        }
        .modal-overlay.active{display:flex}
        .modal{
            background:var(--bg-card);border-radius:var(--radius-lg);
            border:1px solid var(--border2);max-width:860px;width:100%;
            max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
            animation:modalIn .22s ease;
        }
        @keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .modal-header{
            padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);
            display:flex;justify-content:space-between;align-items:center;
            position:sticky;top:0;background:var(--bg-card);z-index:10;
            border-radius:var(--radius-lg) var(--radius-lg) 0 0;
        }
        .modal-header h3{font-size:1.02rem;font-weight:700}
        .modal-close{
            background:none;border:none;color:var(--text2);font-size:1.2rem;
            cursor:pointer;width:30px;height:30px;border-radius:.35rem;
            display:flex;align-items:center;justify-content:center;transition:var(--t);
        }
        .modal-close:hover{background:var(--bg-hover);color:var(--red2)}
        .modal-acts{display:flex;gap:.35rem}
        .modal-body{padding:1.5rem}
        .modal-video{
            position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
            border-radius:var(--radius);margin-bottom:1.25rem;background:#000;
            box-shadow:var(--shadow);
        }
        .modal-video iframe,.modal-video video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
        .guide-content{color:var(--text2);line-height:1.8;font-size:.88rem}
        .guide-content h3{color:var(--text);font-size:1rem;margin:1.2rem 0 .55rem;font-weight:700}
        .guide-content h3:first-child{margin-top:0}
        .guide-content p{margin-bottom:.55rem}
        .guide-content strong{color:var(--text)}
        .guide-content ul{margin:.4rem 0 .4rem 1.5rem}
        .guide-content li{margin-bottom:.25rem}
