<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀世界 - PVP攻略站</title>
    <style>
        :root {
            --bg: #0c0f17;
            --card: #141824;
            --card2: #1a1f2e;
            --text: #e8eaed;
            --text2: #8892a4;
            --red: #c62828;
            --red2: #e53935;
            --cyan: #1a8fc4;
            --cyan2: #26a5da;
            --gold: #c88a2c;
            --gold2: #e2a834;
            --green: #2e7d32;
            --green2: #43a047;
            --border: rgba(136,146,164,0.12);
            --radius: 0.5rem;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
            background: var(--bg); color: var(--text); line-height:1.6; min-height:100vh;
        }

        /* Header */
        .header {
            background: rgba(12,15,23,0.92);
            border-bottom:1px solid var(--border);
            padding:0.65rem 1.5rem; position:sticky; top:0; z-index:100;
            backdrop-filter: blur(12px);
        }
        .header-inner {
            max-width:1280px; margin:0 auto;
            display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:0.75rem;
        }
        .logo { font-size:1.15rem; font-weight:700; color:var(--red2); display:flex; align-items:center; gap:0.5rem; }
        .logo i { font-style:normal; font-size:1.3rem; }
        .header-nav { display:flex; gap:0.15rem; flex-wrap:wrap; }
        .header-nav a {
            padding:0.4rem 0.9rem; border-radius:0.35rem; cursor:pointer;
            text-decoration:none; color:var(--text2); font-size:0.88rem;
            font-weight:500; transition:0.15s;
        }
        .header-nav a:hover { color:var(--text); background:var(--card2); }
        .header-nav a.active { color:var(--red2); background:rgba(198,40,40,0.08); }
        .header-actions { display:flex; gap:0.35rem; align-items:center; }
        .btn-icon {
            width:34px; height:34px; border-radius:0.35rem;
            border:1px solid var(--border); background:var(--card);
            color:var(--text2); cursor:pointer; font-size:1rem;
            display:flex; align-items:center; justify-content:center; transition:0.15s;
        }
        .btn-icon:hover { color:var(--red2); border-color:var(--red); }
        .hamburger {
            display:none; background:none; border:1px solid var(--border);
            color:var(--text); font-size:1.2rem; cursor:pointer;
            width:36px; height:36px; border-radius:0.35rem;
            align-items:center; justify-content:center; transition:0.15s;
        }
        .hamburger:hover { border-color:var(--red); color:var(--red2); }

        /* Hero Banner */
        .hero-banner { max-width:1280px; margin:1.5rem auto; padding:0 1.5rem; }
        .hero-slider {
            background: linear-gradient(135deg, #1a1520 0%, #141824 50%, #0f1a25 100%);
            border:1px solid var(--border); border-radius:0.6rem; overflow:hidden; position:relative;
        }
        .hero-slide {
            display:none; padding:2rem 2.5rem; align-items:center; gap:2rem; min-height:200px;
        }
        .hero-slide.active { display:flex; }
        .hero-slide .hero-avatar {
            width:110px; height:110px; border-radius:0.5rem;
            background:var(--card2); display:flex; align-items:center;
            justify-content:center; font-size:3rem; flex-shrink:0; border:2px solid var(--border);
        }
        .hero-slide .hero-info h2 { font-size:1.3rem; font-weight:700; margin-bottom:0.35rem; }
        .hero-slide .hero-info .sub { color:var(--text2); font-size:0.88rem; margin-bottom:0.5rem; }
        .hero-slide .hero-info .desc { color:var(--text2); font-size:0.85rem; line-height:1.7; }
        .hero-slide .hero-tags { display:flex; gap:0.35rem; margin-top:0.75rem; flex-wrap:wrap; }
        .hero-tag {
            padding:0.2rem 0.6rem; border-radius:0.25rem; font-size:0.75rem;
            font-weight:600; border:1px solid; color:var(--red2);
            border-color:rgba(198,40,40,0.3); background:rgba(198,40,40,0.08);
        }
        .hero-dots { display:flex; gap:0.4rem; justify-content:center; padding:0.75rem; }
        .hero-dot { width:8px; height:8px; border-radius:50%; background:var(--border); cursor:pointer; transition:0.2s; }
        .hero-dot.active { background:var(--red2); width:20px; border-radius:4px; }

        @media (max-width:768px) {
            .hero-slide { flex-direction:column; text-align:center; padding:1.5rem; }
            .hero-slide .hero-avatar { width:80px; height:80px; font-size:2.2rem; }
        }

        /* Code Banner */
        .code-banner { max-width:1280px; margin:0 auto 1.5rem; padding:0 1.5rem; }
        .code-banner-inner {
            background: linear-gradient(135deg, rgba(198,40,40,0.12) 0%, rgba(26,143,196,0.08) 100%);
            border:1px solid rgba(198,40,40,0.2); border-radius:0.6rem;
            padding:1.25rem 1.5rem; display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;
        }
        .code-banner-inner .cb-icon { font-size:2rem; flex-shrink:0; }
        .code-banner-inner .cb-info { flex:1; min-width:200px; }
        .code-banner-inner .cb-title { font-weight:700; font-size:0.95rem; margin-bottom:0.2rem; }
        .code-banner-inner .cb-codes { display:flex; gap:0.75rem; flex-wrap:wrap; }
        .code-tag {
            background:rgba(198,40,40,0.15); border:1px solid rgba(198,40,40,0.3);
            padding:0.35rem 0.8rem; border-radius:0.3rem; font-family:monospace;
            font-size:0.9rem; color:var(--red2); cursor:pointer; transition:0.15s; font-weight:600;
        }
        .code-tag:hover { background:rgba(198,40,40,0.25); }
        .code-tag .reward { display:block; font-size:0.7rem; color:var(--text2); font-weight:400; margin-top:0.1rem; font-family:inherit; }
        .cb-copied { position:fixed; top:1rem; left:50%; transform:translateX(-50%);
            background:var(--green); color:#fff; padding:0.5rem 1.5rem; border-radius:0.35rem;
            font-size:0.85rem; z-index:999; pointer-events:none; transition:0.3s; opacity:0; }

        /* Search */
        .search-wrap { max-width:1280px; margin:0 auto 1rem; padding:0 1.5rem; }
        .search-box { max-width:560px; margin:0 auto; position:relative; }
        .search-input {
            width:100%; padding:0.75rem 1rem 0.75rem 2.6rem;
            border-radius:0.4rem; border:1px solid var(--border);
            background:var(--card); color:var(--text); font-size:0.9rem;
            outline:none; transition:border-color 0.2s;
        }
        .search-input:focus { border-color:var(--cyan); }
        .search-icon { position:absolute; left:0.85rem; top:50%; transform:translateY(-50%); color:var(--text2); }

        /* Filters */
        .filter-wrap {
            max-width:1280px; margin:0 auto 1.25rem; padding:0 1.5rem;
            display:flex; gap:0.35rem; flex-wrap:wrap; align-items:center;
        }
        .filter-label { color:var(--text2); font-size:0.8rem; margin-right:0.3rem; }
        .filter-tag {
            padding:0.25rem 0.75rem; border-radius:1rem; cursor:pointer;
            border:1px solid var(--border); background:var(--card);
            color:var(--text2); font-size:0.8rem; transition:0.15s;
        }
        .filter-tag:hover { border-color:var(--text2); color:var(--text); }
        .filter-tag.active { background:var(--red); color:#fff; border-color:var(--red); }

        /* Main Content */
        .main-content { max-width:1280px; margin:0 auto 3rem; padding:0 1.5rem; }
        .section-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.25rem; }
        .section-title { font-size:1.15rem; font-weight:700; color:var(--text); }
        .section-count { color:var(--text2); font-size:0.82rem; }

        /* Card Grid */
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:1rem; }

        /* Horizontal Scroll */
        .hscroll-wrap { margin-bottom:2rem; }
        .hscroll {
            display:flex; gap:1rem; overflow-x:auto; padding-bottom:0.5rem;
            scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
        }
        .hscroll::-webkit-scrollbar { height:4px; }
        .hscroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
        .hscroll .card { min-width:300px; scroll-snap-align:start; }

        /* Section tabs on home */
        .home-sections { max-width:1280px; margin:0 auto; padding:0 1.5rem; }
        .home-section-tabs { display:flex; gap:0.15rem; margin-bottom:1.25rem; }
        .home-section-tab {
            padding:0.55rem 1.4rem; border-radius:0.35rem 0.35rem 0 0; cursor:pointer;
            color:var(--text2); font-size:0.95rem; font-weight:600;
            border-bottom:2px solid transparent; transition:0.15s;
        }
        .home-section-tab:hover { color:var(--text); }
        .home-section-tab.active { color:var(--red2); border-bottom-color:var(--red2); }

        /* Card */
        .card {
            background:var(--card); border:1px solid var(--border);
            border-radius:0.5rem; cursor:pointer; transition:0.2s;
            overflow:hidden; display:flex; flex-direction:column;
        }
        .card:hover { transform:translateY(-2px); border-color:rgba(136,146,164,0.25); }
        .card-img {
            height:160px; background:var(--card2);
            display:flex; align-items:center; justify-content:center;
            font-size:3rem; position:relative; overflow:hidden;
        }
        .card-img img { width:100%; height:100%; object-fit:cover; }
        .card-img video { width:100%; height:100%; object-fit:cover; }
        .card-badge {
            position:absolute; top:0.5rem; right:0.5rem; padding:0.2rem 0.5rem;
            border-radius:0.25rem; font-size:0.7rem; font-weight:700; z-index:2;
        }
        .badge-new { background:var(--green); color:#fff; }
        .badge-hot { background:var(--red); color:#fff; }
        .badge-vid {
            position:absolute; bottom:0.5rem; right:0.5rem; padding:0.2rem 0.45rem;
            border-radius:0.25rem; font-size:0.7rem; font-weight:600; z-index:2;
            background:rgba(0,0,0,0.7); color:#fff;
        }
        .card-body { padding:1rem 1.25rem 1.25rem; flex:1; display:flex; flex-direction:column; }
        .card-title {
            font-size:1rem; font-weight:700; margin-bottom:0.35rem;
            display:flex; justify-content:space-between; align-items:center;
        }
        .card-fav {
            background:none; border:none; cursor:pointer; font-size:1rem;
            padding:0.15rem; transition:0.15s; opacity:0.5;
        }
        .card-fav:hover, .card-fav.active { opacity:1; }
        .card-meta { color:var(--text2); font-size:0.8rem; margin-bottom:0.5rem; }
        .card-tags { display:flex; gap:0.3rem; flex-wrap:wrap; margin-bottom:0.5rem; }
        .card-tag {
            padding:0.15rem 0.45rem; border-radius:0.2rem;
            background:rgba(26,143,196,0.08); color:var(--cyan2);
            font-size:0.72rem; font-weight:500; border:1px solid rgba(26,143,196,0.15);
        }
        .card-desc { color:var(--text2); font-size:0.84rem; line-height:1.55; margin-top:auto;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        /* Accordion */
        .accordion { display:flex; flex-direction:column; gap:0.6rem; }
        .accordion-item {
            background:var(--card); border:1px solid var(--border);
            border-radius:0.5rem; overflow:hidden;
        }
        .accordion-header {
            padding:1rem 1.25rem; cursor:pointer; display:flex;
            justify-content:space-between; align-items:center;
            font-weight:600; font-size:0.95rem; transition:0.15s;
        }
        .accordion-header:hover { background:var(--card2); }
        .accordion-header .arr { transition:0.25s; color:var(--text2); font-size:0.8rem; }
        .accordion-item.open .accordion-header .arr { transform:rotate(180deg); }
        .accordion-body { display:none; padding:0 1.25rem 1.25rem; }
        .accordion-item.open .accordion-body { display:block; }
        .accordion-body ul { list-style:none; }
        .accordion-body li {
            padding:0.45rem 0; border-bottom:1px solid var(--border);
            color:var(--text2); font-size:0.85rem;
        }
        .accordion-body li:last-child { border-bottom:none; }

        /* Modal */
        .modal-overlay {
            position:fixed; top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.6); display:none;
            align-items:center; justify-content:center; z-index:1000; padding:1rem;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--card); border-radius:0.6rem; border:1px solid var(--border);
            max-width:800px; width:100%; max-height:85vh; overflow-y:auto;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding:1.25rem 1.5rem; border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
            position:sticky; top:0; background:var(--card); z-index:10;
            border-radius:0.6rem 0.6rem 0 0;
        }
        .modal-header h3 { font-size:1.1rem; font-weight:700; }
        .modal-close {
            background:none; border:none; color:var(--text2); font-size:1.3rem;
            cursor:pointer; width:32px; height:32px; border-radius:0.35rem;
            display:flex; align-items:center; justify-content:center; transition:0.15s;
        }
        .modal-close:hover { background:var(--card2); color:var(--red2); }
        .modal-actions { display:flex; gap:0.4rem; }
        .modal-body { padding:1.5rem; }
        .modal-video-wrap {
            position:relative; padding-bottom:56.25%; height:0; overflow:hidden;
            border-radius:0.4rem; margin-bottom:1.25rem; background:#000;
        }
        .modal-video-wrap iframe {
            position:absolute; top:0; left:0; width:100%; height:100%; border:0;
        }
        .modal-video-wrap video {
            position:absolute; top:0; left:0; width:100%; height:100%;
        }
        .guide-content { color:var(--text2); line-height:1.8; font-size:0.9rem; }
        .guide-content h3 { color:var(--text); font-size:1.05rem; margin:1.25rem 0 0.6rem; font-weight:700; }
        .guide-content h3:first-child { margin-top:0; }
        .guide-content p { margin-bottom:0.6rem; }
        .guide-content strong { color:var(--text); }
        .guide-content ul { margin:0.4rem 0 0.4rem 1.5rem; }
        .guide-content li { margin-bottom:0.3rem; }
        .empty-state { text-align:center; padding:4rem 2rem; color:var(--text2); }
        .empty-state .icon { font-size:3rem; margin-bottom:1rem; opacity:0.5; }

        /* Favorites Sidebar */
        .overlay {
            position:fixed; top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.4); display:none; z-index:150;
        }
        .overlay.active { display:block; }
        .sidebar {
            position:fixed; right:-400px; top:0; bottom:0; width:400px;
            max-width:90vw; background:var(--card); border-left:1px solid var(--border);
            z-index:200; transition:right 0.3s ease; overflow-y:auto;
            box-shadow:-8px 0 30px rgba(0,0,0,0.4);
        }
        .sidebar.active { right:0; }
        .sidebar-header {
            padding:1.25rem 1.5rem; border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
            position:sticky; top:0; background:var(--card); z-index:10;
        }
        .sidebar-header h3 { font-size:1rem; font-weight:700; }
        .sidebar-list { padding:0.75rem 1rem; }
        .fav-item {
            padding:1rem; background:var(--bg); border-radius:0.4rem;
            margin-bottom:0.5rem; cursor:pointer; transition:0.15s;
            border:1px solid transparent;
        }
        .fav-item:hover { border-color:var(--border); transform:translateX(-3px); }

        .page-section { display:none; }
        .page-section.active { display:block; }

        @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--text2); }

        @media (max-width:768px) {
            .hamburger { display:flex; }
            .header { padding:0.6rem 1rem; }
            .header-nav {
                display:none; width:100%; flex-direction:column;
                order:3; background:var(--card); border-radius:0.4rem;
                border:1px solid var(--border); padding:0.3rem;
            }
            .header-nav.open { display:flex; }
            .header-nav a { padding:0.6rem 0.75rem; }
            .grid { grid-template-columns:1fr; gap:0.75rem; }
            .hero-banner, .code-banner, .search-wrap, .filter-wrap, .main-content, .home-sections { padding:0 1rem; }
            .sidebar { width:100%; right:-100%; }
            .modal-body { padding:1rem; }
            .hscroll .card { min-width:260px; }
            .home-section-tab { font-size:0.85rem; padding:0.45rem 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><i>⚔</i> 王者荣耀世界 · PVP攻略站</div>
            <button class="hamburger" id="hamburgerBtn" aria-label="菜单">☰</button>
            <nav class="header-nav" id="headerNav">
                <a data-tab="home" class="active">首页</a>
                <a data-tab="pvp">PVP攻略</a>
                <a data-tab="explore">探索攻略</a>
                <a data-tab="quickref">速查</a>
            </nav>
            <div class="header-actions">
                <button class="btn-icon" id="favBtn" title="收藏夹">★</button>
            </div>
        </div>
    </header>

    <!-- Home -->
    <div class="page-section active" id="pageHome">
        <div class="hero-banner">
            <div class="hero-slider" id="heroSlider"></div>
            <div class="hero-dots" id="heroDots"></div>
        </div>
        <div class="code-banner" id="codeBannerSection"></div>
        <div class="home-sections">
            <div class="home-section-tabs" id="homeSectionTabs">
                <span class="home-section-tab active" data-hometab="pvp">PVP热门</span>
                <span class="home-section-tab" data-hometab="explore">探索热门</span>
            </div>
            <div class="section-header">
                <h2 class="section-title" id="homeSectionTitle">PVP热门攻略</h2>
            </div>
            <div class="grid" id="homeGrid"></div>
        </div>
    </div>

    <!-- List pages -->
    <div class="page-section" id="pageList">
        <div class="search-wrap">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索攻略...">
            </div>
        </div>
        <div class="filter-wrap" id="filterSection"></div>
        <main class="main-content">
            <div class="section-header">
                <h2 class="section-title" id="sectionTitle"></h2>
                <span class="section-count" id="resultCount"></span>
            </div>
            <div class="grid" id="cardGrid"></div>
        </main>
    </div>

    <!-- QuickRef -->
    <div class="page-section" id="pageQuickRef">
        <main class="main-content">
            <div class="section-header"><h2 class="section-title">速查手册</h2></div>
            <div class="accordion" id="quickRefAccordion"></div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <div class="modal-actions">
                    <button class="btn-icon" id="modalFavBtn" title="收藏" style="font-size:1.1rem;">☆</button>
                    <button class="btn-icon" id="modalCopyBtn" title="复制" style="font-size:0.9rem;">📋</button>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Copied toast -->
    <div class="cb-copied" id="copiedToast">已复制</div>

    <!-- Favorites Sidebar -->
    <div class="overlay" id="favoritesOverlay"></div>
    <aside class="sidebar" id="favoritesSidebar">
        <div class="sidebar-header">
            <h3>★ 我的收藏</h3>
            <button class="modal-close" id="favClose">&times;</button>
        </div>
        <div class="sidebar-list" id="favoritesList"><p style="color:var(--text2);">暂无收藏</p></div>
    </aside>

    <script>
        const API = 'https://wzrysjglz.onrender.com/api/data';
        const LS_FAV = 'wzry_favs_v2';
        let dataCache = {};
        let currentTab = 'home';
        let currentFilter = 'all';
        let searchQuery = '';
        let heroBannerTimer = null;
        let homeCurrentTab = 'pvp';

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem(LS_FAV) || '[]'); } catch { return []; }
        }
        function saveFavorites(favs) { localStorage.setItem(LS_FAV, JSON.stringify(favs)); }
        function toggleFavorite(id, tab) {
            let favs = getFavorites();
            const idx = favs.findIndex(f => f.id === id && f.tab === tab);
            if (idx >= 0) favs.splice(idx, 1); else favs.push({ id, tab });
            saveFavorites(favs);
        }
        function isFavorited(id, tab) {
            return getFavorites().some(f => f.id === id && f.tab === tab);
        }

        async function loadData(tab) {
            if (dataCache[tab]) return dataCache[tab];
            try {
                const res = await fetch(`${API}/${tab}`);
                const data = await res.json();
                dataCache[tab] = data;
                return data;
            } catch(e) { return []; }
        }

        function getApiTable(tab) {
            if (tab === 'pvp') return 'pvp_guides';
            if (tab === 'explore') return 'explore_guides';
            if (tab === 'quickref') return 'quickref';
            return tab;
        }

        function switchTab(tab) {
            currentTab = tab;
            currentFilter = 'all';
            searchQuery = '';
            const si = document.getElementById('searchInput');
            if (si) si.value = '';
            document.querySelectorAll('.header-nav a').forEach(a => a.classList.remove('active'));
            const navLink = document.querySelector(`.header-nav a[data-tab="${tab}"]`);
            if (navLink) navLink.classList.add('active');

            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('pageHome').classList.add('active');
                loadHomePage();
            } else if (tab === 'quickref') {
                document.getElementById('pageQuickRef').classList.add('active');
                loadData('quickref').then(renderQuickRef);
            } else {
                document.getElementById('pageList').classList.add('active');
                loadData(getApiTable(tab)).then(() => {
                    renderSectionTitle();
                    renderFilters();
                    renderCards();
                });
            }
        }

        // ========== Home Page ==========
        async function loadHomePage() {
            const pvp = await loadData('pvp_guides');
            renderHeroBanner(pvp);
            const codes = await loadData('codes');
            renderCodeBanner(codes);
            const explore = await loadData('explore_guides');
            renderHomeGrid(pvp, explore);
            bindHomeTabs(pvp, explore);
        }

        function renderHeroBanner(guides) {
            const slider = document.getElementById('heroSlider');
            const dots = document.getElementById('heroDots');
            const featured = guides.filter(g => g.badge === 'hot' || g.badge === 'new').slice(0, 4);
            if (!featured.length) {
                document.querySelector('.hero-banner').style.display = 'none';
                return;
            }
            if (heroBannerTimer) clearInterval(heroBannerTimer);
            let currentIdx = 0;
            const show = (idx) => {
                currentIdx = idx;
                const g = featured[idx];
                const tags = Array.isArray(g.tags) ? g.tags : [];
                slider.innerHTML = `
                    <div class="hero-slide active">
                        <div class="hero-avatar">${g.icon || '⚔️'}</div>
                        <div class="hero-info">
                            <h2>${g.title}${g.badge === 'new' ? ' <small style="color:var(--green2);">NEW</small>' : g.badge === 'hot' ? ' <small style="color:var(--red2);">HOT</small>' : ''}</h2>
                            <p class="sub">${g.category === '1v1' ? '1v1竞技' : g.category === '4v4' ? '4v4团队' : g.category === 'general' ? '通用技巧' : g.category}</p>
                            <p class="desc">${g.description || ''}</p>
                            <div class="hero-tags">${tags.map(t => `<span class="hero-tag">${t}</span>`).join('')}</div>
                        </div>
                    </div>`;
                dots.innerHTML = featured.map((_, i) => `<span class="hero-dot${i === idx ? ' active' : ''}" data-idx="${i}"></span>`).join('');
                dots.querySelectorAll('.hero-dot').forEach(d => {
                    d.addEventListener('click', () => show(parseInt(d.dataset.idx)));
                });
            };
            show(0);
            heroBannerTimer = setInterval(() => show((currentIdx + 1) % featured.length), 5000);
        }

        function renderCodeBanner(codes) {
            const section = document.getElementById('codeBannerSection');
            const active = codes.filter(c => c.is_active === 1);
            if (!active.length) { section.style.display = 'none'; return; }
            section.innerHTML = `
                <div class="code-banner-inner">
                    <div class="cb-icon">🎁</div>
                    <div class="cb-info">
                        <div class="cb-title">最新兑换码</div>
                        <div class="cb-codes">
                            ${active.map(c => `
                                <span class="code-tag" onclick="copyCode('${c.code}', this)" title="${c.reward || ''}">
                                    ${c.code}
                                    <span class="reward">${c.reward || ''} · ${c.expiry || '长期有效'}</span>
                                </span>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
        }

        function renderHomeGrid(pvp, explore) {
            const grid = document.getElementById('homeGrid');
            const data = homeCurrentTab === 'pvp' ? pvp : explore;
            document.getElementById('homeSectionTitle').textContent = homeCurrentTab === 'pvp' ? 'PVP热门攻略' : '探索热门攻略';
            const items = data.filter(g => g.badge === 'hot' || g.badge === 'new').slice(0, 6);
            if (!items.length) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">📖</div><p>暂无内容</p></div>';
                return;
            }
            grid.innerHTML = items.map(g => renderCard(g, 'pvp_guides')).join('');
        }

        function bindHomeTabs(pvp, explore) {
            document.getElementById('homeSectionTabs').addEventListener('click', e => {
                const tab = e.target.closest('.home-section-tab');
                if (!tab) return;
                homeCurrentTab = tab.dataset.hometab;
                document.querySelectorAll('.home-section-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderHomeGrid(pvp, explore);
            });
        }

        function renderCard(item, apiTable) {
            const id = item.id;
            const name = item.title || item.name || item.code || '';
            const badge = (item.badge || '').toLowerCase();
            const desc = item.description || '';
            const tags = Array.isArray(item.tags) ? item.tags : [];
            const catLabel = item.category || '';
            const imageUrl = item.image_url || '';
            const videoUrl = item.video_url || '';
            const isFav = isFavorited(id, apiTable);

            let badgeHtml = '';
            if (badge === 'new') badgeHtml = '<span class="card-badge badge-new">最新</span>';
            else if (badge === 'hot') badgeHtml = '<span class="card-badge badge-hot">热门</span>';

            let vidBadge = '';
            if (videoUrl) vidBadge = '<span class="badge-vid">▶ 视频</span>';

            const imageHtml = imageUrl ? `<img src="${imageUrl}" alt="${name}" loading="lazy">` : '';
            const iconHtml = !imageUrl ? item.icon || '📖' : '';

            return `<div class="card" data-id="${id}" data-tab="${apiTable}">
                <div class="card-img">${badgeHtml}${vidBadge}${imageHtml}${iconHtml}</div>
                <div class="card-body">
                    <div class="card-title">
                        <span>${name}</span>
                        <button class="card-fav${isFav ? ' active' : ''}" data-id="${id}" data-tab="${apiTable}" onclick="event.stopPropagation();toggleFavCard(this, '${apiTable}', ${id})">${isFav ? '♥' : '☆'}</button>
                    </div>
                    ${catLabel ? `<div class="card-meta">${catLabel === '1v1' ? '1v1竞技' : catLabel === '4v4' ? '4v4团队' : catLabel === 'general' ? '通用技巧' : catLabel === 'map' ? '地图探索' : catLabel === 'boss' ? 'BOSS攻略' : catLabel === 'collection' ? '收集养成' : catLabel}</div>` : ''}
                    ${tags.length ? `<div class="card-tags">${tags.slice(0,3).map(t => `<span class="card-tag">${t}</span>`).join('')}</div>` : ''}
                    <div class="card-desc">${desc}</div>
                </div>
            </div>`;
        }

        function toggleFavCard(el, tab, id) {
            toggleFavorite(id, tab);
            const isFav = isFavorited(id, tab);
            el.textContent = isFav ? '♥' : '☆';
            el.classList.toggle('active', isFav);
        }

        // ========== List Pages ==========
        const TAB_TITLES = { pvp:'PVP攻略', explore:'探索攻略' };
        const TAB_API = { pvp:'pvp_guides', explore:'explore_guides' };
        const TAB_FILTERS = {
            pvp: ['1v1','4v4','general'],
            explore: ['map','boss','collection']
        };
        const FILTER_LABELS = {
            pvp: { '1v1':'1v1竞技', '4v4':'4v4团队', 'general':'通用技巧' },
            explore: { 'map':'地图探索', 'boss':'BOSS攻略', 'collection':'收集养成' }
        };

        function renderSectionTitle() {
            document.getElementById('sectionTitle').textContent = TAB_TITLES[currentTab] || currentTab;
        }

        function renderFilters() {
            const section = document.getElementById('filterSection');
            const filters = TAB_FILTERS[currentTab] || [];
            const badgeFilters = ['new', 'hot'];
            let html = '<span class="filter-label">筛选：</span>';
            html += `<span class="filter-tag active" data-filter="all">全部</span>`;
            filters.forEach(f => {
                const label = (FILTER_LABELS[currentTab] || {})[f] || f;
                html += `<span class="filter-tag" data-filter="${f}">${label}</span>`;
            });
            badgeFilters.forEach(f => html += `<span class="filter-tag" data-filter="${f}">${f === 'new' ? '最新' : '热门'}</span>`);
            section.innerHTML = html;
            section.querySelectorAll('.filter-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    section.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderCards();
                });
            });
        }

        function getFilteredData(data) {
            let rows = [...data];
            if (currentFilter && currentFilter !== 'all') {
                if (currentFilter === 'new' || currentFilter === 'hot') {
                    rows = rows.filter(item => (item.badge || '').toLowerCase() === currentFilter);
                } else {
                    rows = rows.filter(item => {
                        const cat = (item.category || '').toLowerCase();
                        return cat === currentFilter.toLowerCase();
                    });
                }
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                rows = rows.filter(item =>
                    ['title', 'description', 'category'].some(k =>
                        String(item[k] || '').toLowerCase().includes(q)
                    ) || (Array.isArray(item.tags) && item.tags.some(t => String(t).toLowerCase().includes(q)))
                );
            }
            return rows;
        }

        async function renderCards() {
            const apiTable = TAB_API[currentTab] || currentTab;
            const data = await loadData(apiTable);
            const filtered = getFilteredData(data);
            const grid = document.getElementById('cardGrid');
            document.getElementById('resultCount').textContent = `共 ${filtered.length} 条`;

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有找到相关内容</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(item => renderCard(item, apiTable)).join('');
        }

        // Card click → modal
        document.addEventListener('click', async function(e) {
            const card = e.target.closest('.card[data-id]');
            if (!card) return;
            if (e.target.closest('.card-fav')) return;
            const id = parseInt(card.dataset.id);
            const tab = card.dataset.tab;
            const data = await loadData(tab);
            const item = data.find(d => d.id === id);
            if (item) openModal(item, tab);
        });

        // Modal
        function openModal(item, tab) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = item.title || item.name || '';
            overlay.dataset.itemId = item.id;
            overlay.dataset.itemTab = tab;
            const favBtn = document.getElementById('modalFavBtn');
            favBtn.textContent = isFavorited(item.id, tab) ? '♥' : '☆';

            let html = '';

            // Video embed
            const videoUrl = item.video_url || '';
            if (videoUrl) {
                const ytMatch = videoUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
                const biliMatch = videoUrl.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
                if (ytMatch) {
                    html += `<div class="modal-video-wrap"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen></iframe></div>`;
                } else if (biliMatch) {
                    html += `<div class="modal-video-wrap"><iframe src="https://player.bilibili.com/player.html?bvid=${biliMatch[1]}&page=1" allowfullscreen></iframe></div>`;
                } else if (videoUrl.match(/\.(mp4|webm|mov)/i)) {
                    html += `<div class="modal-video-wrap"><video controls src="${videoUrl}"></video></div>`;
                } else {
                    html += `<div class="modal-video-wrap"><iframe src="${videoUrl}" allowfullscreen></iframe></div>`;
                }
            }

            // Content
            if (item.content) {
                html += `<div class="guide-content">${item.content}</div>`;
            } else if (item.description) {
                html += `<div class="guide-content"><p>${item.description}</p></div>`;
            }

            // Tags & meta
            const tags = Array.isArray(item.tags) ? item.tags : [];
            if (tags.length) {
                const cat = item.category || '';
                html += `<div style="margin-top:1.25rem;display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;">
                    ${cat ? `<span style="color:var(--text2);font-size:0.8rem;">分类：${cat}</span>` : ''}
                    ${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                </div>`;
            }

            document.getElementById('modalBody').innerHTML = html;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // QuickRef
        function renderQuickRef(data) {
            const accordion = document.getElementById('quickRefAccordion');
            if (!data.length) {
                accordion.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无内容</p></div>';
                return;
            }
            accordion.innerHTML = data.map((q, i) => {
                const items = Array.isArray(q.items) ? q.items : [];
                return `<div class="accordion-item${i === 0 ? ' open' : ''}">
                    <div class="accordion-header" onclick="this.parentElement.classList.toggle('open')">
                        <span>${q.icon || ''} ${q.title}</span>
                        <span class="arr">▾</span>
                    </div>
                    <div class="accordion-body"><ul>${items.map(it => `<li>${it}</li>`).join('')}</ul></div>
                </div>`;
            }).join('');
        }

        // Favorites
        function renderFavorites() {
            const list = document.getElementById('favoritesList');
            const favs = getFavorites();
            if (!favs.length) {
                list.innerHTML = '<p style="color:var(--text2);">暂无收藏</p>';
                return;
            }
            list.innerHTML = favs.map(f => {
                const data = (dataCache[f.tab] || []).find(d => d.id === f.id);
                if (!data) return '';
                const name = data.title || data.name || data.code || '未知';
                const tabNames = { pvp_guides:'PVP攻略', explore_guides:'探索攻略', codes:'兑换码', quickref:'速查' };
                return `<div class="fav-item" data-tab="${f.tab}" data-id="${f.id}">
                    <strong>${name}</strong>
                    <div style="font-size:0.78rem;color:var(--text2);">${tabNames[f.tab] || f.tab}</div>
                </div>`;
            }).filter(Boolean).join('');
        }

        function toggleFavoritesSidebar() {
            const sidebar = document.getElementById('favoritesSidebar');
            const overlay = document.getElementById('favoritesOverlay');
            const isActive = sidebar.classList.toggle('active');
            overlay.classList.toggle('active', isActive);
            if (isActive) renderFavorites();
        }

        // Copy
        function copyCode(code, el) {
            navigator.clipboard.writeText(code).then(() => {
                const toast = document.getElementById('copiedToast');
                toast.textContent = `已复制: ${code}`;
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            }).catch(() => {});
        }

        // Events
        document.querySelectorAll('.header-nav a').forEach(a => {
            a.addEventListener('click', () => switchTab(a.dataset.tab));
        });
        document.getElementById('searchInput').addEventListener('input', e => {
            searchQuery = e.target.value;
            if (currentTab !== 'home' && currentTab !== 'quickref') renderCards();
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        document.getElementById('modalFavBtn').addEventListener('click', function() {
            const overlay = document.getElementById('modalOverlay');
            const id = parseInt(overlay.dataset.itemId);
            const tab = overlay.dataset.itemTab;
            toggleFavorite(id, tab);
            this.textContent = isFavorited(id, tab) ? '♥' : '☆';
        });
        document.getElementById('modalCopyBtn').addEventListener('click', async () => {
            const overlay = document.getElementById('modalOverlay');
            const tab = overlay.dataset.itemTab;
            const id = parseInt(overlay.dataset.itemId);
            const data = await loadData(tab);
            const item = data.find(d => d.id === id);
            if (!item) return;
            const text = `【${item.title || ''}】\n${(item.content || item.description || '').replace(/<[^>]*>/g, '')}`;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copiedToast');
                toast.textContent = '内容已复制';
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            }).catch(() => {});
        });
        document.getElementById('favBtn').addEventListener('click', toggleFavoritesSidebar);
        document.getElementById('favClose').addEventListener('click', toggleFavoritesSidebar);
        document.getElementById('favoritesOverlay').addEventListener('click', toggleFavoritesSidebar);

        document.getElementById('favoritesList').addEventListener('click', async (e) => {
            const item = e.target.closest('.fav-item');
            if (!item) return;
            const tab = item.dataset.tab;
            const id = parseInt(item.dataset.id);
            toggleFavoritesSidebar();
            const frontTab = tab === 'pvp_guides' ? 'pvp' : tab === 'explore_guides' ? 'explore' : tab === 'quickref' ? 'quickref' : 'home';
            switchTab(frontTab);
            const data = await loadData(tab);
            const found = data.find(d => d.id === id);
            if (found) openModal(found, tab);
        });

        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            document.getElementById('headerNav').classList.toggle('open');
        });

        // Init
        switchTab('home');
    </script>
</body>
</html>
