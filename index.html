<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀世界 · 攻略站</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg: rgba(13,21,32,0.6);
            --bg-card: rgba(17,26,39,0.7);
            --bg-hover: rgba(23,34,49,0.7);
            --bg-elevated: rgba(26,37,53,0.7);
            --text: #EFF2F6;
            --text2: #8496AD;
            --text3: #5A6D85;
            --neon: #a855f7;
            --neon2: #40c9ff;
            --neon-bg: rgba(168,85,247,0.08);
            --neon-glow: rgba(64,201,255,0.15);
            --accent-red: #f43f5e;
            --accent-red2: #f0606a;
            --accent-red-bg: rgba(244,63,94,0.08);
            --cyan: #40c9ff;
            --cyan2: #6dd5ff;
            --cyan-bg: rgba(64,201,255,0.07);
            --accent-green: #22c55e;
            --accent-green2: #52C072;
            --border: rgba(168,85,247,0.08);
            --border2: rgba(168,85,247,0.14);
            --radius: 12px;
            --radius-lg: 16px;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --t: 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
            --t-smooth: 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
            --t-bounce: 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
            --glass: rgba(255,255,255,0.03);
            --glass-border: rgba(168,85,247,0.12);
            --glass-blur: blur(20px);
            --font: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:var(--font);background:#000;color:var(--text);
            line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;position:relative;
        }

        /* ── CRT 扫描线 + 霓虹光晕 ── */
        body::after {
            content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
            background-image:radial-gradient(circle at 50% 50%,#0000 0,#0000 2px,hsl(0 0 4%) 2px);
            background-size:8px 8px;
            animation:5s ease-in-out hiii infinite;
            --f:blur(3em) brightness(9);
        }
        @keyframes hiii{
            0%{backdrop-filter:var(--f) hue-rotate(0deg)}
            25%{backdrop-filter:var(--f) hue-rotate(-25deg)}
            28%{backdrop-filter:var(--f) hue-rotate(0deg)}
            32%{backdrop-filter:var(--f) hue-rotate(-20deg)}
            39%{backdrop-filter:var(--f) hue-rotate(0deg)}
            40%{backdrop-filter:var(--f) hue-rotate(-20deg)}
            41%{backdrop-filter:var(--f) hue-rotate(0deg)}
            42%{backdrop-filter:var(--f) hue-rotate(-25deg)}
            44%{backdrop-filter:var(--f) hue-rotate(0deg)}
            58%{backdrop-filter:var(--f) hue-rotate(-20deg)}
            64%{backdrop-filter:var(--f) hue-rotate(0deg)}
            80%{backdrop-filter:var(--f) hue-rotate(-25deg)}
            to{backdrop-filter:var(--f) hue-rotate(0deg)}
        }

        /* ── 霓虹数据雨 ── */
        body::before{
            content:"";position:absolute;inset:-145%;rotate:-45deg;
            --c:#a855f7;--c1:#40c9ff;
            background-image:radial-gradient(4px 100px at 0px 235px,var(--c),#0000),radial-gradient(4px 100px at 300px 235px,var(--c),#0000),radial-gradient(3px 4px at 150px 117.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 252px,var(--c),#0000),radial-gradient(4px 100px at 300px 252px,var(--c),#0000),radial-gradient(3px 4px at 150px 126px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 150px,var(--c),#0000),radial-gradient(4px 100px at 300px 150px,var(--c),#0000),radial-gradient(3px 4px at 150px 75px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 253px,var(--c),#0000),radial-gradient(4px 100px at 300px 253px,var(--c),#0000),radial-gradient(3px 4px at 150px 126.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 204px,var(--c),#0000),radial-gradient(4px 100px at 300px 204px,var(--c),#0000),radial-gradient(3px 4px at 150px 102px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 134px,var(--c),#0000),radial-gradient(4px 100px at 300px 134px,var(--c),#0000),radial-gradient(3px 4px at 150px 67px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 179px,var(--c),#0000),radial-gradient(4px 100px at 300px 179px,var(--c),#0000),radial-gradient(3px 4px at 150px 89.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 299px,var(--c),#0000),radial-gradient(4px 100px at 300px 299px,var(--c),#0000),radial-gradient(3px 4px at 150px 149.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 215px,var(--c),#0000),radial-gradient(4px 100px at 300px 215px,var(--c),#0000),radial-gradient(3px 4px at 150px 107.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 281px,var(--c),#0000),radial-gradient(4px 100px at 300px 281px,var(--c),#0000),radial-gradient(3px 4px at 150px 140.5px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 158px,var(--c),#0000),radial-gradient(4px 100px at 300px 158px,var(--c),#0000),radial-gradient(3px 4px at 150px 79px,var(--c1) 100%,#0000 150%),radial-gradient(4px 100px at 0px 210px,var(--c),#0000),radial-gradient(4px 100px at 300px 210px,var(--c),#0000),radial-gradient(3px 4px at 150px 105px,var(--c1) 100%,#0000 150%);
            background-size:300px 235px,300px 235px,300px 235px,300px 252px,300px 252px,300px 252px,300px 150px,300px 150px,300px 150px,300px 253px,300px 253px,300px 253px,300px 204px,300px 204px,300px 204px,300px 134px,300px 134px,300px 134px,300px 179px,300px 179px,300px 179px,300px 299px,300px 299px,300px 299px,300px 215px,300px 215px,300px 215px,300px 281px,300px 281px,300px 281px,300px 158px,300px 158px,300px 158px,300px 210px,300px 210px,300px 210px;
            animation:hi 150s linear infinite;
            z-index:-2;pointer-events:none;
        }
        @keyframes hi{
            0%{background-position:0px 220px,3px 220px,151.5px 337.5px,25px 24px,28px 24px,176.5px 150px,50px 16px,53px 16px,201.5px 91px,75px 224px,78px 224px,226.5px 350.5px,100px 19px,103px 19px,251.5px 121px,125px 120px,128px 120px,276.5px 187px,150px 31px,153px 31px,301.5px 120.5px,175px 235px,178px 235px,326.5px 384.5px,200px 121px,203px 121px,351.5px 228.5px,225px 224px,228px 224px,376.5px 364.5px,250px 26px,253px 26px,401.5px 105px,275px 75px,278px 75px,426.5px 180px}
            to{background-position:0px 6800px,3px 6800px,151.5px 6917.5px,25px 13632px,28px 13632px,176.5px 13758px,50px 5416px,53px 5416px,201.5px 5491px,75px 17175px,78px 17175px,226.5px 17301.5px,100px 5119px,103px 5119px,251.5px 5221px,125px 8428px,128px 8428px,276.5px 8495px,150px 9876px,153px 9876px,301.5px 9965.5px,175px 13391px,178px 13391px,326.5px 13540.5px,200px 14741px,203px 14741px,351.5px 14848.5px,225px 18770px,228px 18770px,376.5px 18910.5px,250px 5082px,253px 5082px,401.5px 5161px,275px 6375px,278px 6375px,426.5px 6480px}
        }

        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(168,85,247,0.25);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(168,85,247,0.45)}

        /* ── Ripple 加载动画 ── */
        .loader-ripple{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;position:relative}
        .loader-ripple::before,.loader-ripple::after{
            content:'';position:absolute;inset:0;border-radius:50%;
            border:2px solid #a855f7;animation:ripple 1.5s ease-out infinite;
        }
        .loader-ripple::after{animation-delay:.75s;border-color:#40c9ff}
        @keyframes ripple{
            0%{transform:scale(0);opacity:.6}
            100%{transform:scale(1.3);opacity:0}
        }
        .loader-ring{width:36px;height:36px;border-radius:50%;border:3px solid rgba(168,85,247,0.1);border-top-color:#a855f7;border-right-color:#40c9ff;animation:spin-ring .8s linear infinite}
        @keyframes spin-ring{to{transform:rotate(360deg)}}

        /* ── Logo 呼吸光晕 ── */
        .logo svg{filter:drop-shadow(0 0 6px rgba(168,85,247,0.3));animation:logo-breathe 3s ease-in-out infinite}
        @keyframes logo-breathe{
            0%,100%{filter:drop-shadow(0 0 6px rgba(168,85,247,0.3)) drop-shadow(0 0 12px transparent)}
            50%{filter:drop-shadow(0 0 8px rgba(168,85,247,0.5)) drop-shadow(0 0 20px rgba(64,201,255,0.2))}
        }

        /* ═══════ HEADER ═══════ */
        .header{
            position:sticky;top:0;z-index:100;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(24px) saturate(180%);
            -webkit-backdrop-filter:blur(24px) saturate(180%);
            border-bottom:1px solid var(--glass-border);
        }
        .h-inner{
            max-width:1400px;margin:0 auto;padding:0 1.5rem;
            display:flex;justify-content:space-between;align-items:center;
            height:60px;gap:1rem;
        }
        .logo{
            font-size:1rem;font-weight:800;color:#fff;
            display:flex;align-items:center;gap:.5rem;letter-spacing:.02em;
            white-space:nowrap;
        }
        .logo svg{width:28px;height:28px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(168,85,247,0.5))}
        .h-nav{display:flex;gap:4px}
        .h-nav a{
            display:flex;align-items:center;gap:.4rem;
            padding:.5rem 1rem;border-radius:10px;cursor:pointer;
            text-decoration:none;color:var(--text2);font-size:.85rem;
            font-weight:600;transition:var(--t-smooth);position:relative;
            background:transparent;
        }
        .h-nav a svg{width:17px;height:17px;flex-shrink:0;opacity:.6;transition:var(--t-smooth)}
        .h-nav a:hover{color:#fff;background:var(--glass);backdrop-filter:var(--glass-blur)}
        .h-nav a:hover svg{opacity:1}
        .h-nav a.active{color:#fff;background:rgba(168,85,247,0.15);backdrop-filter:var(--glass-blur)}
        .h-nav a.active svg{opacity:1;color:#fff}
        .h-nav a.active::after{
            content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
            width:55%;height:2px;background:linear-gradient(90deg,#e81cff,#40c9ff);border-radius:1px;
            filter:blur(1px);
        }
        .h-acts{display:flex;gap:6px;align-items:center}
        .btn-icon{
            width:38px;height:38px;border-radius:10px;
            border:1px solid var(--glass-border);background:var(--glass);
            backdrop-filter:var(--glass-blur);color:var(--text2);cursor:pointer;font-size:1rem;
            display:flex;align-items:center;justify-content:center;transition:var(--t-smooth);
            position:relative;
        }
        .btn-icon:hover{color:#fff;border-color:rgba(168,85,247,0.3);box-shadow:0 0 20px rgba(168,85,247,0.15);background:rgba(168,85,247,0.1)}
        .btn-icon .dot{
            position:absolute;top:5px;right:5px;width:6px;height:6px;
            border-radius:50%;background:var(--accent-red);display:none;
        }
        .btn-icon .dot.show{display:block}
        .hamburger{
            display:none;background:var(--glass);border:1px solid var(--glass-border);
            backdrop-filter:var(--glass-blur);color:var(--text);font-size:1.2rem;cursor:pointer;
            width:38px;height:38px;border-radius:10px;
            align-items:center;justify-content:center;
        }

        /* ═══════ PVP MODE TABS (LOL-style sub-nav) ═══════ */
        .mode-tabs{
            max-width:1400px;margin:1.5rem auto 0;padding:0 1.5rem;
            display:flex;gap:2px;border-bottom:1px solid var(--glass-border);
            overflow-x:auto;-webkit-overflow-scrolling:touch;
        }
        .mode-tab{
            display:flex;align-items:center;gap:.45rem;
            padding:.7rem 1.25rem;cursor:pointer;white-space:nowrap;
            color:var(--text2);font-size:.88rem;font-weight:600;
            transition:var(--t-smooth);font-family:var(--font);
            position:relative;border-radius:10px 10px 0 0;
        }
        .mode-tab svg{width:18px;height:18px;opacity:.55;flex-shrink:0;transition:var(--t-smooth)}
        .mode-tab:hover{color:#fff;background:var(--glass);backdrop-filter:var(--glass-blur)}
        .mode-tab:hover svg{opacity:.85}
        .mode-tab.active{color:#fff;background:rgba(168,85,247,0.1);backdrop-filter:var(--glass-blur)}
        .mode-tab.active::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,#e81cff,#40c9ff,#e81cff);
            filter:blur(2px);
        }
        .mode-tab.active svg{opacity:1;color:#fff}
        .mode-tab.active{text-shadow:0 0 10px rgba(168,85,247,0.5),0 0 40px rgba(168,85,247,0.2)}
        @keyframes glitch{
            0%{text-shadow:-1px 0 #40c9ff,1px 0 #e81cff}
            20%{text-shadow:1px 0 #40c9ff,-1px 0 #e81cff}
            40%{text-shadow:-2px 0 #40c9ff,2px 0 #e81cff}
            60%{text-shadow:2px 0 #e81cff,-1px 0 #40c9ff}
            80%{text-shadow:-1px 0 #e81cff,1px 0 #40c9ff}
            100%{text-shadow:-1px 0 #40c9ff,1px 0 #e81cff}
        }
        .mode-tab.active:hover{animation:glitch .4s ease-in-out infinite}
        .mode-tab .tip{
            font-size:.65rem;padding:.1rem .4rem;border-radius:8px;
            font-weight:700;letter-spacing:.04em;line-height:1.4;
        }
        .tip-new{background:linear-gradient(-45deg,#40c9ff,#e81cff);color:#fff}
        .tip-hot{background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff}

        /* ═══════ HERO BANNER ═══════ */
        .hero-section{max-width:1400px;margin:1.5rem auto;padding:0 1.5rem}
        .hero-banner{
            border-radius:16px;overflow:hidden;position:relative;
            background:rgba(0,0,0,0.5);
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border:1px solid var(--glass-border);min-height:200px;
        }
        .hero-banner::before{
            content:'';position:absolute;inset:0;z-index:0;
            background:
                radial-gradient(circle at 20% 30%,rgba(168,85,247,0.12),transparent 50%),
                radial-gradient(circle at 80% 60%,rgba(64,201,255,0.08),transparent 40%);
        }
        .hero-banner::after{
            content:'';position:absolute;inset:-1px;border-radius:17px;
            background:linear-gradient(-45deg,#e81cff,#40c9ff);
            z-index:-1;filter:blur(15px);opacity:0.15;
        }
        .hero-slide{
            display:none;padding:2.5rem 3rem;align-items:center;gap:2.5rem;
            position:relative;z-index:1;animation:slideIn .5s var(--t-smooth);
        }
        @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .hero-slide.active{display:flex}
        .hero-av{
            width:100px;height:100px;border-radius:12px;
            background:var(--glass);backdrop-filter:var(--glass-blur);
            display:flex;align-items:center;justify-content:center;
            font-size:2.5rem;flex-shrink:0;border:1px solid var(--glass-border);
            box-shadow:0 0 25px rgba(168,85,247,0.1);
        }
        .hero-info{flex:1;min-width:0}
        .hero-info h2{font-size:1.35rem;font-weight:800;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;color:#fff}
        .hero-badge{font-size:.65rem;padding:.2rem .6rem;border-radius:10px;font-weight:700;letter-spacing:.03em;backdrop-filter:var(--glass-blur)}
        .hero-badge.hot{background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff}
        .hero-badge.new{background:linear-gradient(-45deg,#40c9ff,#e81cff);color:#fff}
        .hero-info .sub{color:var(--text2);font-size:.85rem;margin-bottom:.5rem}
        .hero-info .desc{color:var(--text2);font-size:.84rem;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .hero-tags{display:flex;gap:.4rem;margin-top:.75rem;flex-wrap:wrap}
        .hero-tag{padding:.2rem .7rem;border-radius:10px;font-size:.73rem;font-weight:500;border:1px solid var(--glass-border);color:#fff;background:var(--glass);backdrop-filter:var(--glass-blur);transition:var(--t-smooth)}
        .hero-tag:hover{border-color:rgba(168,85,247,0.3);box-shadow:0 0 12px rgba(168,85,247,0.15)}
        .hero-dots{display:flex;gap:.5rem;justify-content:center;padding:.85rem;position:relative;z-index:1}
        .hero-dot{width:8px;height:8px;border-radius:50%;cursor:pointer;background:rgba(168,85,247,0.2);transition:var(--t-smooth)}
        .hero-dot.active{background:linear-gradient(-45deg,#e81cff,#40c9ff);width:24px;border-radius:4px}

        /* ═══════ CODE BANNER ═══════ */
        .cb-wrap{max-width:1400px;margin:0 auto 1.25rem;padding:0 1.5rem}
        .cb-inner{
            background:var(--glass);
            backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border);border-radius:14px;
            padding:1.15rem 1.35rem;display:flex;align-items:center;gap:1.15rem;flex-wrap:wrap;
            position:relative;
        }
        .cb-inner::before{
            content:'';position:absolute;inset:-1px;border-radius:15px;
            background:linear-gradient(-45deg,#e81cff,#40c9ff);
            z-index:-1;filter:blur(8px);opacity:0.12;
        }
        .cb-inner .cb-icon{font-size:1.6rem;flex-shrink:0}
        .cb-inner .cb-info{flex:1;min-width:180px}
        .cb-inner .cb-title{font-weight:700;font-size:.9rem;color:#fff;margin-bottom:.2rem}
        .cb-codes{display:flex;gap:.6rem;flex-wrap:wrap}
        .code-tag{
            padding:.35rem .8rem;border-radius:10px;
            background:var(--glass);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);
            font-family:'SF Mono','Menlo',monospace;font-size:.85rem;
            color:#fff;cursor:pointer;transition:var(--t-smooth);font-weight:600;
        }
        .code-tag:hover{border-color:rgba(168,85,247,0.3);box-shadow:0 0 18px rgba(168,85,247,0.15);transform:translateY(-2px)}
        .code-tag .reward{display:block;font-size:.66rem;color:var(--text2);font-weight:400;font-family:var(--font)}

        /* ═══════ SEARCH + FILTERS ═══════ */
        .search-wrap{max-width:1400px;margin:0 auto .85rem;padding:0 1.5rem}
        #poda{display:flex;align-items:center;justify-content:center;position:relative}
        .white,.border,.darkBorderBg,.glow{
            max-height:70px;max-width:314px;height:100%;width:100%;
            position:absolute;overflow:hidden;z-index:-1;
            border-radius:12px;filter:blur(3px);
        }
        .input{
            background-color:#010201;border:none;width:301px;height:56px;
            border-radius:10px;color:white;padding-inline:59px;font-size:18px;
            font-family:var(--font);
        }
        .input::placeholder{color:#c0b9c0}
        .input:focus{outline:none}
        #main:focus-within > #input-mask{display:none}
        #input-mask{
            pointer-events:none;width:100px;height:20px;position:absolute;
            background:linear-gradient(90deg,transparent,black);top:18px;left:70px;
        }
        #pink-mask{
            pointer-events:none;width:30px;height:20px;position:absolute;
            background:#cf30aa;top:10px;left:5px;filter:blur(20px);
            opacity:0.8;transition:all 2s;
        }
        #main:hover > #pink-mask{opacity:0}
        .white{
            max-height:63px;max-width:307px;border-radius:10px;filter:blur(2px);
        }
        .white::before{
            content:"";z-index:-2;text-align:center;top:50%;left:50%;
            transform:translate(-50%,-50%) rotate(83deg);position:absolute;
            width:600px;height:600px;background-repeat:no-repeat;
            background-position:0 0;filter:brightness(1.4);
            background-image:conic-gradient(rgba(0,0,0,0) 0%,#a099d8,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 50%,#dfa2da,rgba(0,0,0,0) 58%);
            transition:all 2s;
        }
        .border{
            max-height:59px;max-width:303px;border-radius:11px;filter:blur(0.5px);
        }
        .border::before{
            content:"";z-index:-2;text-align:center;top:50%;left:50%;
            transform:translate(-50%,-50%) rotate(70deg);position:absolute;
            width:600px;height:600px;filter:brightness(1.3);
            background-repeat:no-repeat;background-position:0 0;
            background-image:conic-gradient(#1c191c,#402fb5 5%,#1c191c 14%,#1c191c 50%,#cf30aa 60%,#1c191c 64%);
            transition:all 2s;
        }
        .darkBorderBg{max-height:65px;max-width:312px}
        .darkBorderBg::before{
            content:"";z-index:-2;text-align:center;top:50%;left:50%;
            transform:translate(-50%,-50%) rotate(82deg);position:absolute;
            width:600px;height:600px;background-repeat:no-repeat;
            background-position:0 0;
            background-image:conic-gradient(rgba(0,0,0,0),#18116a,rgba(0,0,0,0) 10%,rgba(0,0,0,0) 50%,#6e1b60,rgba(0,0,0,0) 60%);
            transition:all 2s;
        }
        #poda:hover > .darkBorderBg::before{transform:translate(-50%,-50%) rotate(262deg)}
        #poda:hover > .glow::before{transform:translate(-50%,-50%) rotate(240deg)}
        #poda:hover > .white::before{transform:translate(-50%,-50%) rotate(263deg)}
        #poda:hover > .border::before{transform:translate(-50%,-50%) rotate(250deg)}
        #poda:hover > .darkBorderBg::before{transform:translate(-50%,-50%) rotate(-98deg)}
        #poda:hover > .glow::before{transform:translate(-50%,-50%) rotate(-120deg)}
        #poda:hover > .white::before{transform:translate(-50%,-50%) rotate(-97deg)}
        #poda:hover > .border::before{transform:translate(-50%,-50%) rotate(-110deg)}
        #poda:focus-within > .darkBorderBg::before{transform:translate(-50%,-50%) rotate(442deg);transition:all 4s}
        #poda:focus-within > .glow::before{transform:translate(-50%,-50%) rotate(420deg);transition:all 4s}
        #poda:focus-within > .white::before{transform:translate(-50%,-50%) rotate(443deg);transition:all 4s}
        #poda:focus-within > .border::before{transform:translate(-50%,-50%) rotate(430deg);transition:all 4s}
        .glow{
            overflow:hidden;filter:blur(30px);opacity:0.4;
            max-height:130px;max-width:354px;
        }
        .glow:before{
            content:"";z-index:-2;text-align:center;top:50%;left:50%;
            transform:translate(-50%,-50%) rotate(60deg);position:absolute;
            width:999px;height:999px;background-repeat:no-repeat;
            background-position:0 0;
            background-image:conic-gradient(#000,#402fb5 5%,#000 38%,#000 50%,#cf30aa 60%,#000 87%);
            transition:all 2s;
        }
        @keyframes rotate{100%{transform:translate(-50%,-50%) rotate(450deg)}}
        @keyframes leftright{0%{transform:translate(0px,0px);opacity:1}49%{transform:translate(250px,0px);opacity:0}80%{transform:translate(-40px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:1}}
        #filter-icon{
            position:absolute;top:8px;right:8px;display:flex;align-items:center;
            justify-content:center;z-index:2;max-height:40px;max-width:38px;
            height:100%;width:100%;isolation:isolate;overflow:hidden;
            border-radius:10px;background:linear-gradient(180deg,#161329,black,#1d1b4b);
            border:1px solid transparent;
        }
        .filterBorder{height:42px;width:40px;position:absolute;overflow:hidden;top:7px;right:7px;border-radius:10px}
        .filterBorder::before{
            content:"";text-align:center;top:50%;left:50%;
            transform:translate(-50%,-50%) rotate(90deg);position:absolute;
            width:600px;height:600px;background-repeat:no-repeat;
            background-position:0 0;filter:brightness(1.35);
            background-image:conic-gradient(rgba(0,0,0,0),#3d3a4f,rgba(0,0,0,0) 50%,rgba(0,0,0,0) 50%,#3d3a4f,rgba(0,0,0,0) 100%);
            animation:rotate 4s linear infinite;
        }
        #main{position:relative}
        #search-icon{position:absolute;left:20px;top:15px}
        .filter-wrap{
            max-width:1400px;margin:0 auto 1.25rem;padding:0 1.5rem;
            display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
        }
        .filter-label{color:var(--text3);font-size:.78rem;margin-right:.25rem}
        .filter-tag{
            padding:.3rem .85rem;border-radius:10px;cursor:pointer;
            border:1px solid var(--glass-border);background:var(--glass);
            backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
            color:var(--text2);font-size:.78rem;transition:var(--t-smooth);font-weight:500;
            position:relative;
        }
        .filter-tag:hover{color:#fff;border-color:rgba(168,85,247,0.3);box-shadow:0 0 12px rgba(168,85,247,0.1);transform:translateY(-1px)}
        .filter-tag.active{color:#fff;border-color:transparent;background:linear-gradient(-45deg,#e81cff,#40c9ff)}

        /* ═══════ HOME TABS ═══════ */
        .home-sections{max-width:1400px;margin:0 auto;padding:0 1.5rem}
        .hs-tabs{display:flex;gap:2px;margin-bottom:1.25rem;border-bottom:1px solid var(--glass-border)}
        .hs-tab{
            padding:.55rem 1.3rem;cursor:pointer;color:var(--text2);
            font-size:.9rem;font-weight:600;transition:var(--t-smooth);
            font-family:var(--font);display:flex;align-items:center;gap:.4rem;
            position:relative;border-radius:10px 10px 0 0;
        }
        .hs-tab:hover{color:#fff;background:var(--glass);backdrop-filter:var(--glass-blur)}
        .hs-tab.active{color:#fff;background:rgba(168,85,247,0.1);backdrop-filter:var(--glass-blur)}
        .hs-tab.active::after{
            content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg,#e81cff,#40c9ff,#e81cff);
            filter:blur(2px);
        }

        /* ═══════ SECTION ═══════ */
        .sec-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.25rem}
        .sec-title{font-size:1.1rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:.6rem}
        .sec-title::before{content:'';width:3px;height:1.1rem;background:linear-gradient(180deg,#e81cff,#40c9ff);border-radius:2px}
        .sec-count{color:var(--text3);font-size:.78rem}

        .main-content{max-width:1400px;margin:0 auto 3rem;padding:0 1.5rem}

        /* ═══════ DATA RANKING SECTION ═══════ */
        .rank-section{max-width:1400px;margin:0 auto 1.75rem;padding:0 1.5rem}
        .rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem}
        .rank-card{
            background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border);border-radius:14px;padding:1.35rem;transition:var(--t-smooth);
            position:relative;overflow:hidden;
        }
        .rank-card::before{
            content:'';position:absolute;inset:-1px;border-radius:15px;
            background:linear-gradient(-45deg,#e81cff,#40c9ff);
            z-index:-1;opacity:0;transition:opacity .5s;filter:blur(8px);
        }
        .rank-card:hover{border-color:transparent;transform:translateY(-3px)}
        .rank-card:hover::before{opacity:1}
        .rank-card .rk-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
        .rank-card .rk-title{font-weight:700;font-size:.9rem;color:#fff}
        .rank-card .rk-icon{font-size:1.3rem}
        .rank-item{
            display:flex;align-items:center;gap:.75rem;padding:.5rem 0;
            border-bottom:1px solid rgba(168,85,247,0.08);transition:var(--t-smooth);
        }
        .rank-item:last-child{border-bottom:none}
        .rank-item:hover{background:rgba(168,85,247,0.05);margin:0 -.5rem;padding:.5rem .5rem;border-radius:10px}
        .rank-num{
            width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0;
            background:var(--glass);color:var(--text3);
        }
        .rank-num.top1{background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff}
        .rank-num.top2{background:rgba(168,85,247,0.2);color:#fff}
        .rank-num.top3{background:rgba(168,85,247,0.15);color:#e81cff}
        .rank-info{flex:1;min-width:0}
        .rank-info .rn{font-size:.85rem;font-weight:700;color:var(--text)}
        .rank-info .rp{font-size:.72rem;color:var(--text3)}
        .rank-bar-wrap{width:65px;height:4px;background:rgba(168,85,247,0.1);border-radius:2px;flex-shrink:0;overflow:hidden}
        .rank-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#e81cff,#40c9ff);transition:width .8s cubic-bezier(0.25,0.46,0.45,0.94)}

        /* ═══════ GRID ═══════ */
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
        @media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
        @media(min-width:1450px){.grid{grid-template-columns:repeat(4,1fr)}}

        /* ═══════ CARD — Uiverse Daniel1227k inspired ═══════ */
        .card{
            position:relative;width:100%;height:280px;
            background:rgba(13,21,32,0.6);
            display:flex;justify-content:center;align-items:center;
            border-radius:14px;cursor:pointer;overflow:hidden;
            transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            will-change:transform;
        }
        .card::before{
            content:'';position:absolute;inset:0;
            background:linear-gradient(315deg,#a855f7,#40c9ff);
            opacity:0;
            transition:opacity 0.5s ease;
        }
        .card::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(315deg,#a855f7,#40c9ff);
            filter:blur(30px);opacity:0;
            transition:opacity 0.5s ease;
        }
        .card:hover::before{opacity:1}
        .card:hover::after{opacity:0.6}
        .card:hover{transform:translateY(-4px)}

        .card .card-inner{
            position:absolute;inset:6px;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-radius:11px;z-index:2;
            display:flex;flex-direction:column;overflow:hidden;
            transition:background 0.4s ease;
        }
        .card:hover .card-inner{background:rgba(0,0,0,0.5)}

        .card .card-media{
            flex:1;display:flex;align-items:center;justify-content:center;
            position:relative;overflow:hidden;
        }
        .card .card-icon{
            font-size:3rem;transition:all 0.5s ease;z-index:1;
            filter:drop-shadow(0 0 8px rgba(168,85,247,0.3));
        }
        .card:hover .card-icon{
            transform:translateY(-20px) scale(0.85);
            opacity:0.6;
            filter:drop-shadow(0 0 15px rgba(168,85,247,0.5));
        }

        .card .card-video-badge{
            position:absolute;top:10px;right:10px;z-index:4;
            background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
            border:1px solid rgba(168,85,247,0.3);
            border-radius:8px;padding:4px 8px;
            font-size:11px;color:#fff;display:flex;align-items:center;gap:4px;
            font-weight:600;pointer-events:none;
        }

        .card .card-body{
            padding:12px 16px 16px;z-index:3;
            transform:translateY(0);transition:all 0.4s ease;
        }
        .card .card-title{
            font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .card .card-meta{
            font-size:12px;color:rgba(255,255,255,0.45);
            display:flex;gap:8px;align-items:center;
        }
        .card .card-meta .badge{
            padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;
            text-transform:uppercase;
        }
        .card .card-meta .badge-hot{background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff}
        .card .card-meta .badge-new{background:rgba(64,201,255,0.2);color:#40c9ff;border:1px solid rgba(64,201,255,0.3)}

        .card .card-tags{
            display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;
            max-height:0;overflow:hidden;transition:max-height 0.4s ease;
        }
        .card:hover .card-tags{
            max-height:40px;
        }
        .card .card-tag{
            padding:1px 7px;border-radius:6px;font-size:10px;
            font-weight:600;background:rgba(168,85,247,0.12);
            color:rgba(255,255,255,0.7);border:1px solid rgba(168,85,247,0.15);
        }

        /* ═══════ BUTTON ═══════ */
        .button{
            position:relative;width:120px;height:40px;
            background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
            display:flex;align-items:center;
            color:white;flex-direction:column;justify-content:center;
            border:1px solid var(--glass-border);padding:12px;gap:12px;border-radius:10px;cursor:pointer;
            font-family:var(--font);font-size:.85rem;font-weight:600;
            transition:var(--t-smooth);
        }
        .button::before{
            content:'';position:absolute;inset:0;left:-4px;top:-1px;margin:auto;
            width:128px;height:48px;border-radius:12px;
            background:linear-gradient(-45deg,#e81cff 0%,#40c9ff 100%);
            z-index:-10;pointer-events:none;
            transition:all 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        .button::after{
            content:"";z-index:-1;position:absolute;inset:0;
            background:linear-gradient(-45deg,#fc00ff 0%,#00dbde 100%);
            transform:translate3d(0,0,0) scale(0.95);filter:blur(20px);
            transition:filter 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
        }
        .button:hover{transform:translateY(-2px)}
        .button:hover::after{filter:blur(30px)}
        .button:hover::before{transform:rotate(-180deg)}
        .button:active::before{scale:0.7}

        /* ═══════ ACCORDION ═══════ */
        .accordion{display:flex;flex-direction:column;gap:.75rem}
        .acc-item{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;transition:var(--t-smooth)}
        .acc-item:hover{border-color:rgba(168,85,247,0.25);box-shadow:0 0 20px rgba(168,85,247,0.08)}
        .acc-hdr{padding:1.1rem 1.35rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.9rem;transition:var(--t-smooth)}
        .acc-hdr:hover{background:rgba(168,85,247,0.05)}
        .acc-hdr .arr{transition:var(--t-smooth);color:var(--text3);font-size:.7rem}
        .acc-item.open .acc-hdr .arr{transform:rotate(180deg);color:#40c9ff}
        .acc-body{display:none;padding:0 1.35rem 1.35rem}
        .acc-item.open .acc-body{display:block}
        .acc-body ul{list-style:none}
        .acc-body li{padding:.5rem 0;border-bottom:1px solid rgba(168,85,247,0.08);color:var(--text2);font-size:.82rem}
        .acc-body li::before{content:'\2022';color:#e81cff;margin-right:.6rem}
        .acc-body li:last-child{border-bottom:none}

        /* ═══════ MODAL ═══════ */
        .modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.75);
            display:none;align-items:center;justify-content:center;
            z-index:1000;padding:1.5rem;backdrop-filter:blur(12px);
        }
        .modal-overlay.active{display:flex}
        .modal{
            background:rgba(0,0,0,0.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
            border-radius:18px;
            border:1px solid var(--glass-border);max-width:860px;width:100%;
            max-height:88vh;overflow-y:auto;
            box-shadow:0 0 50px rgba(168,85,247,0.12),0 0 100px rgba(64,201,255,0.05);
            animation:modalIn .3s var(--t-smooth);position:relative;
        }
        .modal::before{
            content:'';position:absolute;inset:-1px;border-radius:19px;
            background:linear-gradient(-45deg,#e81cff,#40c9ff);
            z-index:-1;filter:blur(12px);opacity:0.2;
        }
        @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .modal-header{
            padding:1.25rem 1.75rem;border-bottom:1px solid var(--glass-border);
            display:flex;justify-content:space-between;align-items:center;
            position:sticky;top:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);z-index:10;
            border-radius:18px 18px 0 0;
        }
        .modal-header h3{font-size:1.05rem;font-weight:700;color:#fff}
        .modal-close{
            background:var(--glass);border:1px solid var(--glass-border);color:var(--text2);font-size:1.2rem;
            cursor:pointer;width:34px;height:34px;border-radius:10px;
            display:flex;align-items:center;justify-content:center;transition:var(--t-smooth);
            backdrop-filter:var(--glass-blur);
        }
        .modal-close:hover{background:rgba(239,68,68,0.15);color:#f43f5e;border-color:rgba(239,68,68,0.3)}
        .modal-acts{display:flex;gap:6px}
        .modal-body{padding:1.75rem}
        .modal-video{
            position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
            border-radius:12px;margin-bottom:1.5rem;background:rgba(0,0,0,0.5);
            box-shadow:0 0 25px rgba(168,85,247,0.08);
        }
        .modal-video iframe,.modal-video video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
        .guide-content{color:var(--text2);line-height:1.85;font-size:.88rem}
        .guide-content h3{color:#fff;font-size:1.02rem;margin:1.35rem 0 .65rem;font-weight:700}
        .guide-content h3:first-child{margin-top:0}
        .guide-content p{margin-bottom:.65rem}
        .guide-content strong{color:#fff}
        .guide-content ul{margin:.5rem 0 .5rem 1.5rem}
        .guide-content li{margin-bottom:.3rem}
        .guide-content li::marker{color:#e81cff}
        .empty-state{text-align:center;padding:4rem 2rem;color:var(--text3)}
        .empty-state .icon{font-size:2.8rem;margin-bottom:.75rem;opacity:.35}

        /* ═══════ FAVORITES ═══════ */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:150;backdrop-filter:blur(8px)}
        .overlay.active{display:block}
        .sidebar{
            position:fixed;right:-420px;top:0;bottom:0;width:400px;max-width:92vw;
            background:rgba(0,0,0,0.7);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
            border-left:1px solid var(--glass-border);
            z-index:200;transition:right .4s cubic-bezier(0.25,0.46,0.45,0.94);
            overflow-y:auto;box-shadow:-10px 0 40px rgba(168,85,247,0.12);
        }
        .sidebar.active{right:0}
        .sidebar-header{
            padding:1.35rem 1.75rem;border-bottom:1px solid var(--glass-border);
            display:flex;justify-content:space-between;align-items:center;
            position:sticky;top:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);z-index:10;
        }
        .sidebar-header h3{font-size:1rem;font-weight:700;color:#fff}
        .sidebar-list{padding:1rem 1.25rem}
        .fav-item{
            padding:1.1rem;background:var(--glass);backdrop-filter:var(--glass-blur);border-radius:12px;
            margin-bottom:.75rem;cursor:pointer;transition:var(--t-smooth);
            border:1px solid var(--glass-border);
        }
        .fav-item:hover{border-color:rgba(168,85,247,0.3);transform:translateX(-4px);box-shadow:0 0 18px rgba(168,85,247,0.1)}

        /* ═══════ TOAST ═══════ */
        .toast{
            position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);
            background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff;padding:.6rem 1.6rem;
            border-radius:12px;font-size:.82rem;z-index:2000;font-weight:600;
            pointer-events:none;opacity:0;transition:opacity .4s;
            box-shadow:0 0 25px rgba(168,85,247,0.3),0 0 50px rgba(64,201,255,0.12);
            backdrop-filter:var(--glass-blur);
        }

        .page-section{display:none;position:relative;z-index:1}
        .page-section.active{display:block}

        /* ═══════ ② TOC 目录 ═══════ */
        .toc{
            background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
            border:1px solid var(--glass-border);
            border-radius:14px;padding:1rem 1.25rem;
            margin-bottom:1.5rem;
        }
        .toc-title{font-size:.84rem;font-weight:700;color:#fff;margin-bottom:.65rem}
        .toc-list{list-style:none;display:flex;flex-wrap:wrap;gap:.45rem}
        .toc-item{
            padding:.25rem .7rem;border-radius:10px;cursor:pointer;
            font-size:.78rem;color:var(--text2);background:var(--glass);
            backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);
            transition:var(--t-smooth);white-space:nowrap;
        }
        .toc-item:hover{color:#fff;border-color:rgba(168,85,247,0.3);box-shadow:0 0 12px rgba(168,85,247,0.1);transform:translateY(-1px)}

        /* ═══════ ⑤ 点赞 ═══════ */
        .like-bar{
            display:flex;align-items:center;gap:.6rem;margin-top:1.5rem;
            padding:1.15rem;background:var(--glass);backdrop-filter:var(--glass-blur);border-radius:14px;
            border:1px solid var(--glass-border);
        }
        .like-btn{
            display:flex;align-items:center;gap:.45rem;
            padding:.5rem 1.15rem;border-radius:10px;cursor:pointer;
            border:1px solid var(--glass-border);background:var(--glass);
            backdrop-filter:var(--glass-blur);color:var(--text2);font-size:.88rem;font-weight:600;
            transition:var(--t-smooth);font-family:var(--font);
        }
        .like-btn:hover{border-color:rgba(168,85,247,0.3);color:#fff;box-shadow:0 0 15px rgba(168,85,247,0.12);transform:translateY(-2px)}
        .like-btn.liked{background:linear-gradient(-45deg,#e81cff,#40c9ff);color:#fff;border-color:transparent}
        .like-count{font-size:.82rem;color:var(--text3)}

        /* ═══════ ① 相关推荐 ═══════ */
        .related-section{margin-top:1.75rem;padding-top:1.5rem;border-top:1px solid var(--glass-border)}
        .related-title{font-size:.92rem;font-weight:700;color:#fff;margin-bottom:.85rem}
        .related-grid{display:flex;gap:.85rem;overflow-x:auto;padding-bottom:.5rem;-webkit-overflow-scrolling:touch}
        .related-grid::-webkit-scrollbar{height:3px}

        const mkEl=document;if(mkEl)mkEl.addEventListener('keydown',e=>{if(e.key==='Escape')cm()});
        const mfbEl=document.getElementById('modalFavBtn');if(mfbEl)mfbEl.addEventListener('click',function(){const o=document.getElementById('modalOverlay');if(!o)return;const id=parseInt(o.dataset.itemId),tb2=o.dataset.itemTab;tfav(id,tb2);this.textContent=isfav(id,tb2)?'♥':'☆'});
        const mcbEl=document.getElementById('modalCopyBtn');if(mcbEl)mcbEl.addEventListener('click',async()=>{const o=document.getElementById('modalOverlay');if(!o)return;const tb2=o.dataset.itemTab,id=parseInt(o.dataset.itemId);try{const d=await ld(tb2);const it=d.find(x=>x.id===id);if(!it)return;const tx=`【${it.title||''}】\n${(it.content||it.description||'').replace(/<[^>]*>/g,'')}`;navigator.clipboard.writeText(tx).then(()=>{const t=document.getElementById('copiedToast');if(t){t.textContent='内容已复制';t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2000)}}).catch(()=>{})}catch(ex){console.warn('copy:',ex)}});
        document.getElementById('favBtn').addEventListener('click',tfs);
        document.getElementById('favClose').addEventListener('click',tfs);
        document.getElementById('favoritesOverlay').addEventListener('click',tfs);
        document.getElementById('favoritesList').addEventListener('click',async e=>{const it=e.target.closest('.fav-item');if(!it)return;const tb2=it.dataset.tab,id=parseInt(it.dataset.id);tfs();const ft=tb2==='pvp_guides'?'pvp':tb2==='explore_guides'?'explore':tb2==='quickref'?'quickref':'home';sw(ft);try{const d=await ld(tb2);const fd=d.find(x=>x.id===id);if(fd){addhist(fd.id,tb2);om(fd,tb2,d)}}catch(ex){console.warn('fav click:',ex)}});

        // Init - with error guard
        try{updot();sw('home')}catch(ex){console.error('init:',ex);document.querySelector('.empty-state')||(document.getElementById('homeGrid').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>页面加载出错，请刷新重试</p></div>')}
    </script>
</body>
</html>
