<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 王者荣耀世界攻略站</title>
    <style>
        :root {
            --bg: #0c0f17; --card: #141824; --card2: #1a1f2e;
            --text: #e8eaed; --text2: #8892a4; --red: #c62828; --red2: #e53935;
            --cyan: #1a8fc4; --cyan2: #26a5da; --gold: #c88a2c; --gold2: #e2a834;
            --border: rgba(136,146,164,0.12); --danger: #e53935;
            --success: #2e7d32; --success2: #43a047; --radius: 0.5rem;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
            background: var(--bg); color: var(--text); min-height:100vh;
        }
        a { color: var(--cyan); text-decoration:none; }

        .login-page {
            display:flex; align-items:center; justify-content:center; min-height:100vh;
            background: linear-gradient(135deg, #0c0f17 0%, #1a1520 50%, #0f141d 100%);
        }
        .login-box {
            background: var(--card); border:1px solid var(--border); border-radius:0.75rem;
            padding:3rem 2.5rem; width:400px; max-width:90vw; text-align:center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-box h1 { font-size:1.4rem; margin-bottom:0.3rem; color: var(--red2); }
        .login-box .sub { color:var(--text2); margin-bottom:2rem; font-size:0.85rem; }
        .login-box input {
            width:100%; padding:0.8rem 1rem; margin-bottom:0.85rem;
            border-radius:0.4rem; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font-size:0.9rem; outline:none;
        }
        .login-box input:focus { border-color:var(--cyan); }
        .login-box button {
            width:100%; padding:0.8rem; border-radius:0.4rem; border:none;
            background: var(--red); color:#fff; font-weight:600; font-size:0.95rem; cursor:pointer;
        }
        .login-box button:hover { background:var(--red2); }
        .login-error { color:var(--danger); font-size:0.82rem; margin-top:0.5rem; display:none; }

        .admin-page { display:none; }
        .topbar {
            background: var(--card); border-bottom:1px solid var(--border);
            padding:0.7rem 1.5rem; display:flex; justify-content:space-between;
            align-items:center; position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:0.5rem;
        }
        .topbar-brand { font-weight:700; color:var(--red2); font-size:1.05rem; }
        .topbar-nav { display:flex; gap:0.15rem; flex-wrap:wrap; }
        .topbar-nav a {
            color:var(--text2); text-decoration:none; padding:0.35rem 0.7rem;
            border-radius:0.35rem; font-size:0.83rem; transition:0.15s; cursor:pointer;
        }
        .topbar-nav a:hover { color:var(--text); background:var(--card2); }
        .topbar-nav a.active { color:var(--red2); background:rgba(198,40,40,0.08); }
        .topbar-actions { display:flex; gap:0.5rem; align-items:center; }
        .btn-outline {
            padding:0.4rem 0.9rem; border-radius:0.35rem; border:1px solid var(--border);
            background:transparent; color:var(--text2); cursor:pointer; font-size:0.82rem; transition:0.15s;
        }
        .btn-outline:hover { border-color:var(--text2); color:var(--text); }
        .btn-outline.danger { border-color:rgba(229,57,53,0.3); color:var(--danger); }
        .btn-outline.danger:hover { border-color:var(--danger); background:rgba(229,57,53,0.08); }
        .btn-solid {
            padding:0.4rem 0.9rem; border-radius:0.35rem; border:none;
            background:var(--red); color:#fff; cursor:pointer; font-size:0.82rem; font-weight:500; transition:0.15s;
        }
        .btn-solid:hover { background:var(--red2); }
        .btn-solid.cyan { background:var(--cyan); }
        .btn-solid.cyan:hover { background:var(--cyan2); }

        .dash-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
            gap:1rem; margin-bottom:1.5rem;
        }
        .dash-card {
            background:var(--card); border:1px solid var(--border); border-radius:0.5rem;
            padding:1.25rem; text-align:center; transition:0.15s;
        }
        .dash-card:hover { border-color:rgba(26,143,196,0.3); }
        .dash-card .count { font-size:2rem; font-weight:700; color:var(--cyan2); }
        .dash-card .label { font-size:0.8rem; color:var(--text2); margin-top:0.2rem; }
        .dash-card .time { font-size:0.72rem; color:var(--text2); margin-top:0.3rem; opacity:0.7; }
        .log-list { max-height:300px; overflow-y:auto; font-size:0.82rem; }
        .log-item { padding:0.55rem 0.75rem; border-bottom:1px solid var(--border); color:var(--text2); display:flex; justify-content:space-between; }
        .log-item:last-child { border-bottom:none; }
        .log-item .log-action { color:var(--text); font-weight:500; }
        .log-item .log-time { font-size:0.72rem; opacity:0.6; white-space:nowrap; margin-left:1rem; }

        .admin-main { max-width:1400px; margin:0 auto; padding:1.5rem; }
        .toolbar { display:flex; gap:0.6rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
        .toolbar input {
            flex:1; min-width:180px; padding:0.55rem 0.75rem;
            border-radius:0.35rem; border:1px solid var(--border);
            background:var(--card); color:var(--text); font-size:0.85rem; outline:none;
        }
        .toolbar input:focus { border-color:var(--cyan); }
        .sep { width:1px; height:24px; background:var(--border); margin:0 0.25rem; }

        .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--border); border-radius:0.5rem; }
        table { width:100%; border-collapse:collapse; min-width:700px; }
        th, td {
            padding:0.6rem 0.75rem; text-align:left; border-bottom:1px solid var(--border); font-size:0.85rem;
        }
        th { background:var(--card2); color:var(--text2); font-weight:600; font-size:0.78rem; position:sticky; top:0; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:rgba(26,143,196,0.03); }
        td.sort-cell { cursor:grab; color:var(--text2); width:30px; text-align:center; user-select:none; }
        td.sort-cell:active { cursor:grabbing; }
        tr.drag-over td { border-top:2px solid var(--cyan); }
        .td-desc { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
        .td-actions { display:flex; gap:0.25rem; white-space:nowrap; }
        .btn-sm {
            padding:0.2rem 0.55rem; border-radius:0.3rem; border:1px solid var(--border);
            background:transparent; color:var(--text2); cursor:pointer; font-size:0.75rem; transition:0.15s;
        }
        .btn-sm:hover { border-color:var(--cyan); color:var(--cyan2); }
        .btn-sm.danger:hover { border-color:var(--danger); color:var(--danger); }
        .btn-sm.gold { border-color:rgba(200,138,44,0.3); color:var(--gold); }
        .btn-sm.gold:hover { border-color:var(--gold2); color:var(--gold2); background:rgba(200,138,44,0.06); }
        .editable-cell { cursor:pointer; border-radius:0.25rem;transition:0.15s;padding:0.15rem 0.3rem;margin:-0.15rem -0.3rem; }
        .editable-cell:hover { background:rgba(26,143,196,0.08); }
        .editable-cell input {
            width:100%; padding:0.2rem 0.3rem; border:1px solid var(--cyan); border-radius:0.25rem;
            background:var(--bg); color:var(--text); font-size:0.85rem; outline:none;
        }
        .badge-tag { display:inline-block; padding:0.1rem 0.4rem; border-radius:0.2rem; font-size:0.72rem; font-weight:600; }
        .badge-new { background:rgba(46,125,50,0.12); color:var(--success2); }
        .badge-hot { background:rgba(229,57,53,0.12); color:var(--danger); }
        .badge-r { background:rgba(26,143,196,0.12); color:var(--cyan2); }
        .badge-vid { background:rgba(200,138,44,0.12); color:var(--gold2); }
        .empty { text-align:center; padding:3rem; color:var(--text2); font-size:0.9rem; }

        .modal-overlay {
            position:fixed; top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.6); display:none; align-items:center;
            justify-content:center; z-index:1000; padding:1rem;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--card); border-radius:0.6rem; border:1px solid var(--border);
            max-width:750px; width:100%; max-height:85vh; overflow-y:auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding:1rem 1.5rem; border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
            position:sticky; top:0; background:var(--card); z-index:10; border-radius:0.6rem 0.6rem 0 0;
        }
        .modal-header h3 { font-size:1.05rem; color:var(--text); }
        .modal-close {
            background:none; border:none; color:var(--text2); font-size:1.3rem;
            cursor:pointer; width:32px; height:32px; border-radius:0.35rem;
            display:flex; align-items:center; justify-content:center; transition:0.15s;
        }
        .modal-close:hover { background:var(--card2); color:var(--danger); }
        .modal-body { padding:1.25rem 1.5rem 1.5rem; }
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; margin-bottom:0.3rem; font-weight:600; font-size:0.82rem; color:var(--text2); }
        .form-group input, .form-group textarea, .form-group select {
            width:100%; padding:0.55rem 0.75rem; border-radius:0.35rem;
            border:1px solid var(--border); background:var(--bg);
            color:var(--text); font-size:0.85rem; outline:none; font-family:inherit; transition:border-color 0.2s;
        }
        .form-group textarea { min-height:100px; resize:vertical; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:var(--cyan); }
        .form-group .help { font-size:0.73rem; color:var(--text2); margin-top:0.2rem; }
        .form-actions { display:flex; gap:0.5rem; justify-content:flex-end; margin-top:0.25rem; }
        .btn-cancel {
            padding:0.5rem 1.2rem; border-radius:0.35rem; border:1px solid var(--border);
            background:transparent; color:var(--text2); cursor:pointer; font-size:0.85rem; transition:0.15s;
        }
        .btn-cancel:hover { border-color:var(--text2); color:var(--text); }
        .rte-bar { display:flex; gap:0.2rem; margin-bottom:0.4rem; flex-wrap:wrap; align-items:center; }
        .rte-btn {
            padding:0.25rem 0.5rem; border-radius:0.25rem; border:1px solid var(--border);
            background:var(--card2); color:var(--text2); cursor:pointer; font-size:0.75rem; transition:0.15s;
        }
        .rte-btn:hover { border-color:var(--cyan); color:var(--cyan2); }
        .rte-btn b { font-weight:700; }
        .rte-btn.vid { border-color:rgba(200,138,44,0.3); color:var(--gold); }
        .rte-btn.vid:hover { border-color:var(--gold2); color:var(--gold2); }
        .inline-flex { display:flex; gap:0.5rem; align-items:flex-end; flex-wrap:wrap; }

        @media (max-width:768px) {
            .topbar { padding:0.6rem 1rem; }
            .topbar-nav { order:3; width:100%; }
            .admin-main { padding:1rem; }
            .dash-grid { grid-template-columns:repeat(2,1fr); }
            .toolbar { flex-direction:column; align-items:stretch; }
            .toolbar .sep { display:none; }
            .modal-body { padding:1rem; }
        }
    </style>
</head>
<body>
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <h1>王者荣耀世界 · 管理后台</h1>
            <p class="sub">PVP + 自由探索攻略内容管理</p>
            <input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
            <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
            <button id="loginBtn">登 录</button>
            <p class="login-error" id="loginError"></p>
        </div>
    </div>

    <div class="admin-page" id="adminPage">
        <header class="topbar">
            <span class="topbar-brand">管理后台</span>
            <nav class="topbar-nav" id="adminNav">
                <a data-table="dashboard" class="active">概览</a>
                <a data-table="pvp_guides">PVP攻略</a>
                <a data-table="explore_guides">探索攻略</a>
                <a data-table="codes">兑换码</a>
                <a data-table="quickref">速查</a>
            </nav>
            <div class="topbar-actions">
                <a href="/" style="font-size:0.82rem;color:var(--text2);">前台</a>
                <button class="btn-outline" id="logoutBtn">退出</button>
            </div>
        </header>
        <main class="admin-main">
            <div class="toolbar" id="toolbarRow">
                <input type="text" id="searchAdmin" placeholder="搜索...">
                <span class="sep"></span>
                <button class="btn-outline" id="btnMedia">媒体库</button>
                <button class="btn-outline" id="btnImport">导入CSV</button>
                <button class="btn-outline danger" id="btnBatchDel">批量删除</button>
                <span class="sep"></span>
                <button class="btn-solid" id="btnAdd">+ 新建</button>
                <button class="btn-outline" id="btnExport">导出备份</button>
            </div>
            <div id="contentWrap"></div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">编辑</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <div class="modal-header">
                <h3>批量导入</h3>
                <button class="modal-close" id="importModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text2);margin-bottom:0.75rem;font-size:0.88rem;">
                    导入类型：<strong id="importTableName"></strong>
                </p>
                <div class="form-group">
                    <label>CSV 文件</label>
                    <input type="file" id="importFile" accept=".csv">
                </div>
                <div id="importPreview" style="margin:0.75rem 0;display:none;">
                    <div id="importPreviewTable" style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:0.35rem;"></div>
                </div>
                <div class="form-actions">
                    <button class="btn-outline" id="btnDownloadTemplate">下载模板</button>
                    <button class="btn-cancel" id="importCancel">取消</button>
                    <button class="btn-solid cyan" id="btnDoImport" style="display:none;">确认导入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Modal -->
    <div class="modal-overlay" id="mediaModal">
        <div class="modal">
            <div class="modal-header">
                <h3>媒体库（图片 + 视频）</h3>
                <button class="modal-close" id="mediaModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>上传文件 (png, jpg, gif, webp, svg, mp4, webm, mov)</label>
                    <input type="file" id="mediaFile" accept="image/*,video/*">
                    <div id="mediaUploadStatus" style="font-size:0.82rem;margin-top:0.4rem;"></div>
                </div>
                <div style="display:flex;gap:0.6rem;flex-wrap:wrap;" id="mediaGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const adminNav = $('adminNav');
        const loginPage = $('loginPage');
        const adminPage = $('adminPage');
        const contentWrap = $('contentWrap');
        const toolbarRow = $('toolbarRow');
        const editModal = $('editModal');
        const modalTitle = $('modalTitle');
        const modalBody = $('modalBody');
        const searchAdmin = $('searchAdmin');

        let currentTable = 'dashboard';
        let currentData = [];
        let editingItem = null;
        let selectedIds = new Set();
        let dragRow = null;

        const GUIDE_FIELDS = [
            { key: 'title', label: '标题', type: 'text' },
            { key: 'description', label: '简介', type: 'textarea' },
            { key: 'icon', label: '图标(emoji)', type: 'text' },
            { key: 'image_url', label: '封面图片链接', type: 'text' },
            { key: 'category', label: '分类', type: 'select', options: {} },
            { key: 'tags', label: '标签(逗号分隔)', type: 'tags' },
            { key: 'badge', label: '角标', type: 'select', options: ['','new','hot'] },
            { key: 'video_url', label: '视频链接', type: 'text' },
            { key: 'content', label: '攻略内容(HTML)', type: 'richtext' },
            { key: 'sort_order', label: '排序', type: 'number' },
        ];

        const TABLE_META = {
            pvp_guides: {
                name: 'PVP攻略',
                fields: GUIDE_FIELDS.map(f => {
                    if (f.key === 'category') return { ...f, options: ['1v1','4v4','general'] };
                    return f;
                }),
                columns: ['sort','icon','title','category','badge','tags','image_url','video_url','description'],
                nameField: 'title',
                catLabels: { '1v1':'1v1竞技', '4v4':'4v4团队', 'general':'通用技巧' }
            },
            explore_guides: {
                name: '探索攻略',
                fields: GUIDE_FIELDS.map(f => {
                    if (f.key === 'category') return { ...f, options: ['map','boss','collection','beginner'] };
                    return f;
                }),
                columns: ['sort','icon','title','category','badge','tags','image_url','video_url','description'],
                nameField: 'title',
                catLabels: { 'map':'地图探索', 'boss':'BOSS攻略', 'collection':'收集养成', 'beginner':'新手入门' }
            },
            codes: {
                name: '兑换码',
                fields: [
                    { key: 'code', label: '兑换码', type: 'text' },
                    { key: 'description', label: '描述', type: 'text' },
                    { key: 'reward', label: '奖励', type: 'text' },
                    { key: 'expiry', label: '有效期', type: 'text' },
                    { key: 'is_active', label: '启用', type: 'select', options: [1,0] },
                    { key: 'sort_order', label: '排序', type: 'number' },
                ],
                columns: ['sort','code','description','reward','expiry','is_active'],
                nameField: 'code'
            },
            quickref: {
                name: '速查',
                fields: [
                    { key: 'title', label: '标题', type: 'text' },
                    { key: 'icon', label: '图标', type: 'text' },
                    { key: 'items', label: '条目(每行一个)', type: 'items' },
                    { key: 'sort_order', label: '排序', type: 'number' },
                ],
                columns: ['sort','icon','title','items'],
                nameField: 'title'
            }
        };

        // Login
        $('loginBtn').addEventListener('click', async () => {
            const u = $('loginUser').value;
            const p = $('loginPass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success) {
                loginPage.style.display = 'none';
                adminPage.style.display = 'block';
                switchTab('dashboard');
            } else {
                $('loginError').textContent = data.error || '账号或密码错误';
                $('loginError').style.display = 'block';
            }
        });
        $('loginPass').addEventListener('keydown', e => {
            if (e.key === 'Enter') $('loginBtn').click();
        });

        (async () => {
            const res = await fetch('/api/admin/check');
            const data = await res.json();
            if (data.logged_in) {
                loginPage.style.display = 'none';
                adminPage.style.display = 'block';
                switchTab('dashboard');
            }
        })();

        adminNav.addEventListener('click', e => {
            if (e.target.tagName === 'A') switchTab(e.target.dataset.table);
        });
        $('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/admin/logout', { method: 'POST' });
            loginPage.style.display = 'flex';
            adminPage.style.display = 'none';
            $('loginPass').value = '';
        });

        function switchTab(table) {
            currentTable = table;
            selectedIds.clear();
            updateBatchBtn();
            document.querySelectorAll('#adminNav a').forEach(a => a.classList.remove('active'));
            const navLink = document.querySelector(`#adminNav a[data-table="${table}"]`);
            if (navLink) navLink.classList.add('active');
            toolbarRow.style.display = table === 'dashboard' ? 'none' : '';
            if (table === 'dashboard') loadDashboard();
            else loadTable(table);
        }

        async function loadDashboard() {
            const res = await fetch('/api/admin/stats');
            const stats = await res.json();
            const tableNames = { pvp_guides:'PVP攻略', explore_guides:'探索攻略', codes:'兑换码', quickref:'速查' };
            let html = '<div class="dash-grid">';
            ['pvp_guides','explore_guides','codes','quickref'].forEach(t => {
                const s = stats[t] || {};
                html += `<div class="dash-card">
                    <div class="count">${s.count ?? '-'}</div>
                    <div class="label">${tableNames[t]}</div>
                    <div class="time">${s.latest ? '更新: '+s.latest.slice(0,16).replace('T',' ') : '暂无数据'}</div>
                </div>`;
            });
            html += '</div>';
            if (stats.logs && stats.logs.length) {
                html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:0.5rem;padding:1.25rem;"><h3 style="font-size:0.95rem;margin-bottom:0.75rem;color:var(--text2);">操作日志</h3><div class="log-list">';
                stats.logs.forEach(log => {
                    html += `<div class="log-item"><span class="log-action">${escHtml(log.action)} <span style="font-weight:400;color:var(--text2);">${escHtml(log.detail)}</span></span><span class="log-time">${(log.created_at||'').slice(0,16).replace('T',' ')}</span></div>`;
                });
                html += '</div></div>';
            }
            contentWrap.innerHTML = html;
        }

        async function loadTable(table) {
            const res = await fetch(`/api/data/${table}`);
            currentData = await res.json();
            renderTable();
        }

        function renderTable() {
            const meta = TABLE_META[currentTable];
            if (!meta) return;
            const q = searchAdmin.value.toLowerCase();
            let rows = currentData;
            if (q) {
                rows = rows.filter(item => {
                    return meta.columns.some(col => {
                        if (col === 'sort') return false;
                        const val = item[col];
                        if (Array.isArray(val)) return val.some(v => String(v).toLowerCase().includes(q));
                        return String(val ?? '').toLowerCase().includes(q);
                    });
                });
            }

            if (!rows.length) { contentWrap.innerHTML = '<div class="empty">暂无数据</div>'; return; }

            let html = '<div class="table-wrap"><table><thead><tr>';
            html += '<th style="width:30px;"><input type="checkbox" id="selectAll" title="全选"></th>';
            html += '<th style="width:30px;"></th>';
            meta.columns.forEach(col => {
                if (col === 'sort') return;
                const labels = { icon:'图标', title:'标题', name:'名称', category:'分类', badge:'角标', tags:'标签', image_url:'封面图', video_url:'视频', description:'简介', id:'ID', code:'兑换码', reward:'奖励', expiry:'有效期', is_active:'状态', items:'条目' };
                html += `<th>${labels[col] || col}</th>`;
            });
            html += '<th style="min-width:180px;">操作</th></tr></thead><tbody>';

            rows.forEach((item, idx) => {
                html += `<tr draggable="true" data-id="${item.id}" data-idx="${idx}" class="drag-row">`;
                html += `<td><input type="checkbox" class="row-cb" data-id="${item.id}" ${selectedIds.has(item.id) ? 'checked' : ''}></td>`;
                html += `<td class="sort-cell" title="拖拽排序">⋮⋮</td>`;
                meta.columns.forEach(col => {
                    if (col === 'sort') return;
                    let val = item[col];
                    if (col === 'icon') {
                        html += `<td style="font-size:1.3rem;">${val || '📖'}</td>`;
                    } else if (col === 'tags' && Array.isArray(val)) {
                        html += `<td>${val.slice(0,3).map(t => `<span class="badge-tag badge-r">${escHtml(t)}</span>`).join(' ')}</td>`;
                    } else if (col === 'badge') {
                        const cls = val === 'new' ? 'badge-new' : val === 'hot' ? 'badge-hot' : '';
                        html += `<td>${val ? `<span class="badge-tag ${cls}">${val==='new'?'最新':'热门'}</span>` : '—'}</td>`;
                    } else if (col === 'image_url') {
                        html += `<td>${val ? '<span class="badge-tag" style="background:rgba(46,125,50,0.12);color:var(--success2);">🖼 有图片</span>' : '—'}</td>`;
                    } else if (col === 'video_url') {
                        html += `<td>${val ? '<span class="badge-tag badge-vid">▶ 有视频</span>' : '—'}</td>`;
                    } else if (col === 'category') {
                        const label = (meta.catLabels || {})[val] || val;
                        html += `<td>${label || '—'}</td>`;
                    } else if (col === 'is_active') {
                        html += `<td style="color:${val?'var(--success2)':'var(--danger)'};">${val ? '启用' : '禁用'}</td>`;
                    } else if (col === 'description') {
                        const s = String(val ?? '').replace(/<[^>]*>/g, '').substring(0, 50);
                        html += `<td class="td-desc" title="${escHtml(String(val??''))}">${s || '—'}</td>`;
                    } else if (col === 'items' && Array.isArray(val)) {
                        html += `<td class="td-desc" title="${escHtml(val.join(' | '))}">${val.slice(0,3).join(' | ')}${val.length>3?'...':''}</td>`;
                    } else if (col === 'title' || col === 'name' || col === 'code') {
                        html += `<td class="editable-cell" data-col="${col}" data-id="${item.id}"><strong>${escHtml(String(val ?? '—'))}</strong></td>`;
                    } else {
                        html += `<td class="editable-cell" data-col="${col}" data-id="${item.id}">${escHtml(String(val ?? '—'))}</td>`;
                    }
                });
                html += `<td class="td-actions">
                    <button class="btn-sm" data-action="edit" data-id="${item.id}">编辑</button>
                    <button class="btn-sm" data-action="dup" data-id="${item.id}">复制</button>
                    <button class="btn-sm gold" data-action="top" data-id="${item.id}">${item.sort_order ? '取消置顶' : '置顶'}</button>
                    <button class="btn-sm danger" data-action="del" data-id="${item.id}">删除</button>
                </td></tr>`;
            });
            html += '</tbody></table></div>';
            contentWrap.innerHTML = html;
            bindTableEvents();
        }

        function bindTableEvents() {
            $('selectAll').addEventListener('change', function() {
                const rows = currentData.filter(r => {
                    const q = searchAdmin.value.toLowerCase();
                    if (!q) return true;
                    return TABLE_META[currentTable].columns.some(col => {
                        if (col === 'sort') return false;
                        return String(r[col] ?? '').toLowerCase().includes(q);
                    });
                });
                if (this.checked) rows.forEach(r => selectedIds.add(r.id));
                else rows.forEach(r => selectedIds.delete(r.id));
                updateBatchBtn();
                renderTable();
            });

            document.querySelectorAll('.row-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    const id = parseInt(this.dataset.id);
                    if (this.checked) selectedIds.add(id); else selectedIds.delete(id);
                    updateBatchBtn();
                });
            });

            contentWrap.addEventListener('click', async e => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                const action = btn.dataset.action;
                if (action === 'edit') openEditModal(id);
                else if (action === 'dup') await duplicateItem(id);
                else if (action === 'top') await toggleTop(id);
                else if (action === 'del') await deleteItem(id);
            });

            // Inline edit
            document.querySelectorAll('.editable-cell').forEach(cell => {
                cell.addEventListener('dblclick', function() {
                    const col = this.dataset.col;
                    const id = parseInt(this.dataset.id);
                    const current = this.textContent === '—' ? '' : this.textContent;
                    const input = document.createElement('input');
                    input.value = current;
                    this.textContent = '';
                    this.appendChild(input);
                    input.focus();
                    input.select();
                    const save = async () => {
                        const newVal = input.value;
                        const data = {};
                        const meta = TABLE_META[currentTable];
                        const field = meta.fields.find(f => f.key === col);
                        if (field && (field.type === 'number' || col === 'sort_order' || col === 'is_active')) {
                            data[col] = Number(newVal) || 0;
                        } else {
                            data[col] = newVal;
                        }
                        await fetch(`/api/admin/${currentTable}/${id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        await loadTable(currentTable);
                    };
                    input.addEventListener('blur', save);
                    input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') loadTable(currentTable); });
                });
            });

            // Drag sort
            document.querySelectorAll('.drag-row').forEach(row => {
                row.addEventListener('dragstart', function(e) {
                    dragRow = this; this.style.opacity = '0.5';
                    e.dataTransfer.effectAllowed = 'move';
                });
                row.addEventListener('dragend', function() {
                    this.style.opacity = '';
                    document.querySelectorAll('.drag-row').forEach(r => r.classList.remove('drag-over'));
                });
                row.addEventListener('dragover', function(e) {
                    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                    if (this !== dragRow) this.classList.add('drag-over');
                });
                row.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                row.addEventListener('drop', async function(e) {
                    e.preventDefault(); this.classList.remove('drag-over');
                    if (this === dragRow) return;
                    const rows = [...document.querySelectorAll('.drag-row')];
                    const fromIdx = rows.indexOf(dragRow);
                    const toIdx = rows.indexOf(this);
                    const moved = currentData.splice(fromIdx, 1)[0];
                    currentData.splice(toIdx, 0, moved);
                    const items = currentData.map((r, i) => ({ id: r.id, sort_order: i }));
                    await fetch(`/api/admin/${currentTable}/sort`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ items })
                    });
                    renderTable();
                });
            });
        }

        function updateBatchBtn() {
            $('btnBatchDel').textContent = selectedIds.size ? `删除(${selectedIds.size})` : '批量删除';
        }

        // CRUD
        $('btnAdd').addEventListener('click', () => openEditModal(null));

        async function duplicateItem(id) {
            await fetch(`/api/admin/${currentTable}/${id}/duplicate`, { method: 'POST' });
            await loadTable(currentTable);
        }

        async function toggleTop(id) {
            await fetch(`/api/admin/${currentTable}/${id}/toggle-top`, { method: 'POST' });
            await loadTable(currentTable);
        }

        async function deleteItem(id) {
            if (!confirm('确认删除？')) return;
            await fetch(`/api/admin/${currentTable}/${id}`, { method: 'DELETE' });
            await loadTable(currentTable);
        }

        // Edit Modal
        $('modalClose').addEventListener('click', closeEditModal);
        editModal.addEventListener('click', e => { if (e.target === editModal) closeEditModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });

        function openEditModal(id) {
            editingItem = id;
            const meta = TABLE_META[currentTable];
            modalTitle.textContent = id ? `编辑${meta.name}` : `新建${meta.name}`;

            let item = {};
            if (id) item = currentData.find(d => d.id === id) || {};

            let html = '';
            meta.fields.forEach(f => {
                let val = item[f.key] ?? '';
                if (Array.isArray(val) && f.key === 'tags') val = val.join(', ');
                if (f.key === 'items' && Array.isArray(val)) val = val.join('\n');

                html += `<div class="form-group">`;
                html += `<label>${f.label}</label>`;

                if (f.type === 'richtext') {
                    html += `<div class="rte-bar">
                        <button class="rte-btn" data-rte="h3" title="标题"><b>H</b></button>
                        <button class="rte-btn" data-rte="strong" title="加粗"><b>B</b></button>
                        <button class="rte-btn" data-rte="p" title="段落">P</button>
                        <button class="rte-btn" data-rte="ul" title="列表">≡</button>
                        <button class="rte-btn" data-rte="li" title="列表项">·</button>
                        <button class="rte-btn vid" data-rte="video" title="插入视频">▶ 视频</button>
                    </div>`;
                    html += `<textarea name="${f.key}" id="rte_${f.key}" rows="12">${escHtml(String(val))}</textarea>`;
                } else if (f.type === 'textarea') {
                    html += `<textarea name="${f.key}" rows="4">${escHtml(String(val))}</textarea>`;
                } else if (f.type === 'items') {
                    html += `<textarea name="${f.key}" rows="5">${escHtml(String(val))}</textarea>`;
                    html += `<div class="help">每行一个条目</div>`;
                } else if (f.type === 'select') {
                    html += `<select name="${f.key}">`;
                    f.options.forEach(opt => {
                        const sel = String(val) === String(opt) ? ' selected' : '';
                        const label = f.key === 'category' ? ((meta.catLabels || {})[opt] || opt) : (opt === '' ? '(无)' : opt);
                        html += `<option value="${opt}"${sel}>${label}</option>`;
                    });
                    html += '</select>';
                } else if (f.type === 'tags') {
                    html += `<input type="text" name="${f.key}" value="${escHtml(String(val))}">`;
                    html += `<div class="help">逗号分隔，如: PVP, 1v1, 排位</div>`;
                } else if (f.key === 'video_url') {
                    html += `<div class="inline-flex"><input type="text" name="${f.key}" value="${escHtml(String(val))}" placeholder="粘贴视频链接 或 从媒体库选择" style="flex:1;"><button type="button" class="btn-outline" onclick="openMediaForVideo()">媒体库</button></div>`;
                    html += `<div class="help">支持: YouTube链接、B站链接、.mp4/.webm直链、其他嵌入链接</div>`;
                } else {
                    html += `<input type="${f.type}" name="${f.key}" value="${escHtml(String(val))}">`;
                }
                html += '</div>';
            });

            html += '<div class="form-actions">';
            html += '<button class="btn-cancel" onclick="closeEditModal()">取消</button>';
            html += '<button class="btn-solid cyan" onclick="saveItem()">保存</button>';
            html += '</div>';

            modalBody.innerHTML = html;
            editModal.classList.add('active');

            // RTE buttons
            modalBody.querySelectorAll('.rte-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tag = this.dataset.rte;
                    if (tag === 'video') {
                        const url = prompt('输入视频链接（YouTube / B站 / .mp4直链 / 嵌入代码）：');
                        if (!url) return;
                        const textareaId = this.closest('.form-group').querySelector('textarea').id;
                        const ta = document.getElementById(textareaId);
                        let embed;
                        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
                        const biliMatch = url.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
                        if (ytMatch) {
                            embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="https://www.youtube.com/embed/${ytMatch[1]}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        } else if (biliMatch) {
                            embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="https://player.bilibili.com/player.html?bvid=${biliMatch[1]}&page=1" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        } else if (url.match(/\.(mp4|webm|mov)/i)) {
                            embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><video controls src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;"></video></div>`;
                        } else {
                            embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        }
                        const start = ta.selectionStart;
                        ta.value = ta.value.substring(0, start) + '\n' + embed + '\n' + ta.value.substring(ta.selectionEnd);
                        ta.focus();
                        return;
                    }
                    const textareaId = this.closest('.form-group').querySelector('textarea').id;
                    const ta = document.getElementById(textareaId);
                    const start = ta.selectionStart, end = ta.selectionEnd;
                    const sel = ta.value.substring(start, end) || '';
                    let wrap;
                    if (tag === 'h3') wrap = [`<h3>`, `</h3>`];
                    else if (tag === 'strong') wrap = [`<strong>`, `</strong>`];
                    else if (tag === 'p') wrap = [`<p>`, `</p>`];
                    else if (tag === 'ul') wrap = [`<ul>\n  `, `\n</ul>`];
                    else if (tag === 'li') wrap = [`<li>`, `</li>`];
                    if (wrap) {
                        ta.value = ta.value.substring(0, start) + wrap[0] + sel + wrap[1] + ta.value.substring(end);
                        ta.focus();
                    }
                });
            });
        }

        function closeEditModal() { editModal.classList.remove('active'); editingItem = null; }

        async function saveItem() {
            const meta = TABLE_META[currentTable];
            const data = {};
            meta.fields.forEach(f => {
                const el = modalBody.querySelector(`[name="${f.key}"]`);
                if (!el) return;
                let val = el.value;
                if (f.key === 'tags') {
                    val = val ? val.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
                } else if (f.key === 'items') {
                    val = val ? val.split('\n').map(s => s.trim()).filter(Boolean) : [];
                } else if (f.key === 'sort_order' || f.key === 'is_active') {
                    val = Number(val) || 0;
                }
                data[f.key] = val;
            });

            let res;
            if (editingItem) {
                res = await fetch(`/api/admin/${currentTable}/${editingItem}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } else {
                res = await fetch(`/api/admin/${currentTable}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            }
            if (res.ok) { closeEditModal(); await loadTable(currentTable); }
        }

        // Batch Delete
        $('btnBatchDel').addEventListener('click', async () => {
            if (!selectedIds.size) return;
            if (!confirm(`确认删除选中的 ${selectedIds.size} 条数据？不可恢复！`)) return;
            await fetch('/api/admin/batch-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table: currentTable, ids: [...selectedIds] })
            });
            selectedIds.clear();
            updateBatchBtn();
            await loadTable(currentTable);
        });

        // Import
        const importModal = $('importModal');
        $('btnImport').addEventListener('click', () => { importModal.classList.add('active'); $('importTableName').textContent = TABLE_META[currentTable].name; });
        $('importModalClose').addEventListener('click', () => importModal.classList.remove('active'));
        $('importCancel').addEventListener('click', () => importModal.classList.remove('active'));
        importModal.addEventListener('click', e => { if (e.target === importModal) importModal.classList.remove('active'); });

        $('btnDownloadTemplate').addEventListener('click', () => {
            window.open(`/api/admin/template/${currentTable}`, '_blank');
        });

        $('importFile').addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;
            const text = await file.text();
            const lines = text.trim().split('\n').filter(l => l.trim());
            if (lines.length < 2) { $('importPreview').style.display = 'none'; $('btnDoImport').style.display = 'none'; return; }
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < Math.min(lines.length, 15); i++) rows.push(parseCSVLine(lines[i]));
            let html = '<table style="font-size:0.76rem;"><thead><tr>';
            headers.forEach(h => html += `<th style="padding:0.3rem 0.4rem;">${escHtml(h)}</th>`);
            html += '</tr></thead><tbody>';
            rows.forEach(row => {
                html += '<tr>';
                headers.forEach(h => html += `<td style="padding:0.3rem 0.4rem;color:var(--text2);">${escHtml(row[h]||'')||'—'}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table>';
            if (lines.length > 15) html += `<p style="color:var(--text2);font-size:0.78rem;margin-top:0.4rem;">...共 ${lines.length-1} 条</p>`;
            $('importPreviewTable').innerHTML = html;
            $('importPreview').style.display = 'block';
            $('btnDoImport').style.display = 'inline-block';
        });

        $('btnDoImport').addEventListener('click', async () => {
            const file = $('importFile').files[0];
            if (!file) return;
            const btn = $('btnDoImport');
            btn.disabled = true; btn.textContent = '导入中...';
            const fd = new FormData(); fd.append('file', file); fd.append('table', currentTable);
            try {
                const res = await fetch('/api/admin/import', { method: 'POST', body: fd });
                const result = await res.json();
                if (result.success) {
                    let msg = `成功导入 ${result.inserted} 条`;
                    if (result.errors.length) msg += `\n${result.errors.length} 条失败:\n${result.errors.slice(0,5).join('\n')}`;
                    alert(msg);
                    importModal.classList.remove('active');
                    await loadTable(currentTable);
                } else {
                    alert('导入失败: ' + (result.error || '未知错误'));
                }
            } catch(e) { alert('导入失败: ' + e.message); }
            btn.disabled = false; btn.textContent = '确认导入';
        });

        function parseCSVLine(line) {
            const result = []; let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inQuotes) {
                    if (ch === '"') { if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; } else inQuotes = false; }
                    else current += ch;
                } else {
                    if (ch === '"') inQuotes = true;
                    else if (ch === ',') { result.push(current.trim()); current = ''; }
                    else current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Media
        const mediaModal = $('mediaModal'), mediaGrid = $('mediaGrid');
        let mediaForVideo = false;

        $('btnMedia').addEventListener('click', async () => { mediaForVideo = false; mediaModal.classList.add('active'); await loadMedia(); });
        $('mediaModalClose').addEventListener('click', () => mediaModal.classList.remove('active'));
        mediaModal.addEventListener('click', e => { if (e.target === mediaModal) mediaModal.classList.remove('active'); });

        function openMediaForVideo() {
            mediaForVideo = true;
            mediaModal.classList.add('active');
            loadMedia();
        }

        async function loadMedia() {
            const res = await fetch('/api/admin/media');
            const files = await res.json();
            if (!files.length) { mediaGrid.innerHTML = '<p style="color:var(--text2);font-size:0.8rem;">暂无文件，上传后出现在这里</p>'; return; }
            mediaGrid.innerHTML = files.map(f => `
                <div style="position:relative;width:120px;text-align:center;background:var(--bg);border-radius:0.35rem;padding:0.4rem;border:1px solid var(--border);">
                    ${f.type === 'image'
                        ? `<img src="${f.url}" style="width:100%;height:75px;object-fit:cover;border-radius:0.2rem;cursor:pointer;" onclick="copyMediaUrl('${f.url}')" title="点击复制链接">`
                        : `<video src="${f.url}" style="width:100%;height:75px;object-fit:cover;border-radius:0.2rem;cursor:pointer;" onclick="copyMediaUrl('${f.url}')" title="点击复制链接"></video>`
                    }
                    <p style="font-size:0.65rem;color:var(--text2);margin:0.25rem 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${f.filename}">${f.filename.substring(0,14)}</p>
                    <div style="display:flex;gap:0.15rem;justify-content:center;">
                        <button class="btn-sm" onclick="copyMediaUrl('${f.url}')">复制</button>
                        <button class="btn-sm danger" onclick="deleteMedia('${f.filename}')">删</button>
                    </div>
                </div>
            `).join('');
        }

        $('mediaFile').addEventListener('change', async function() {
            const file = this.files[0]; if (!file) return;
            $('mediaUploadStatus').innerHTML = '上传中...';
            const fd = new FormData(); fd.append('file', file);
            try {
                const res = await fetch('/api/admin/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    $('mediaUploadStatus').innerHTML = `成功! <a href="${data.url}" target="_blank">${data.url}</a>`;
                    this.value = '';
                    await loadMedia();
                } else {
                    $('mediaUploadStatus').innerHTML = data.error || '失败';
                }
            } catch(e) { $('mediaUploadStatus').innerHTML = '上传失败: ' + e.message; }
        });

        function copyMediaUrl(url) {
            if (mediaForVideo) {
                // Find video_url input in the edit modal
                const videoInput = modalBody.querySelector('[name="video_url"]');
                if (videoInput) {
                    videoInput.value = url;
                    $('mediaUploadStatus').innerHTML = '已填入视频链接: ' + url;
                } else {
                    navigator.clipboard.writeText(url).then(() => $('mediaUploadStatus').innerHTML = '已复制: ' + url);
                }
            } else {
                navigator.clipboard.writeText(url).then(() => $('mediaUploadStatus').innerHTML = '已复制: ' + url)
                    .catch(() => $('mediaUploadStatus').innerHTML = '手动复制: ' + url);
            }
        }

        async function deleteMedia(filename) {
            if (!confirm('删除？')) return;
            await fetch(`/api/admin/media/${filename}`, { method: 'DELETE' });
            await loadMedia();
        }

        // Export
        $('btnExport').addEventListener('click', async () => {
            const res = await fetch('/api/admin/export');
            const data = await res.json();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `wzrysj_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        });

        searchAdmin.addEventListener('input', () => { if (currentTable !== 'dashboard') renderTable(); });

        function escHtml(s) {
            const div = document.createElement('div');
            div.textContent = String(s);
            return div.innerHTML;
        }
    </script>
</body>
</html>
