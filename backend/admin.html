<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06080D;
            --card: #0E1219;
            --card-hover: #151A24;
            --text: #E8ECF2;
            --text2: #8899B4;
            --text3: #5A6D85;
            --gold: #C8922A;
            --gold2: #E2AC3F;
            --gold-bg: rgba(200,146,42,0.1);
            --red: #D9434E;
            --red2: #F0606A;
            --cyan: #2E9EC4;
            --cyan2: #46B8DE;
            --cyan-bg: rgba(46,158,196,0.08);
            --green: #3DA35D;
            --green2: #52C072;
            --border: rgba(136,153,180,0.08);
            --border2: rgba(136,153,180,0.14);
            --radius: 0.625rem;
            --radius-sm: 0.4rem;
            --font: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font); background: var(--bg); color: var(--text);
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }

        /* ── Login ── */
        .login-page {
            display:flex; align-items:center; justify-content:center; min-height:100vh;
            background:
                radial-gradient(ellipse 60% 50% at 50% 30%, rgba(200,146,42,0.05), transparent),
                var(--bg);
        }
        .login-box {
            background: var(--card); border: 1px solid var(--border2);
            border-radius: var(--radius); padding: 3rem 2.5rem;
            width: 420px; max-width: 92vw; text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        .login-box h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--gold2); }
        .login-box .sub { color: var(--text2); margin-bottom: 2rem; font-size: 0.88rem; }
        .login-box input {
            width: 100%; padding: 0.85rem 1rem; margin-bottom: 0.85rem;
            border-radius: var(--radius-sm); border: 1px solid var(--border2);
            background: var(--bg); color: var(--text); font-size: 0.95rem;
            outline: none; font-family: var(--font); transition: 0.2s;
        }
        .login-box input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,146,42,0.1); }
        .login-box .btn-login {
            width: 100%; padding: 0.85rem; border-radius: var(--radius-sm);
            border: none; background: var(--gold); color: #000;
            font-weight: 700; font-size: 1rem; cursor: pointer; font-family: var(--font);
            letter-spacing: 0.05em; transition: 0.2s;
        }
        .login-box .btn-login:hover { background: var(--gold2); }
        .login-error { color: var(--red2); font-size: 0.84rem; margin-top: 0.6rem; display: none; }

        /* ── Admin page ── */
        .admin-page { display: none; }

        /* ── Topbar ── */
        .topbar {
            background: rgba(14,18,25,0.9); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.5rem; position: sticky; top: 0; z-index: 100;
        }
        .topbar-inner {
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            height: 56px; gap: 1rem;
        }
        .topbar-brand {
            font-size: 1.05rem; font-weight: 800; color: var(--gold2);
            white-space: nowrap;
        }
        .topbar-nav { display: flex; gap: 0; }
        .topbar-nav a {
            padding: 0.5rem 1rem; cursor: pointer; font-size: 0.88rem;
            font-weight: 600; color: var(--text2); transition: 0.2s;
            border-bottom: 2px solid transparent; text-decoration: none;
        }
        .topbar-nav a:hover { color: var(--text); }
        .topbar-nav a.active { color: var(--gold2); border-bottom-color: var(--gold); }
        .topbar-actions { display: flex; gap: 0.6rem; align-items: center; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.55rem 1.25rem; border-radius: var(--radius-sm);
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            font-family: var(--font); transition: 0.2s; border: 1px solid;
            white-space: nowrap;
        }
        .btn-primary { background: var(--gold); color: #000; border-color: var(--gold); }
        .btn-primary:hover { background: var(--gold2); border-color: var(--gold2); }
        .btn-outline { background: transparent; color: var(--text2); border-color: var(--border2); }
        .btn-outline:hover { color: var(--text); border-color: var(--text2); }
        .btn-danger { background: transparent; color: var(--red2); border-color: rgba(217,67,78,0.25); }
        .btn-danger:hover { background: rgba(217,67,78,0.1); border-color: var(--red); }
        .btn-ghost { background: transparent; color: var(--text2); border-color: transparent; padding: 0.4rem 0.65rem; }
        .btn-ghost:hover { color: var(--text); background: var(--card-hover); }
        .btn-icon { padding: 0.45rem; min-width: 42px; justify-content: center; }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
        .btn-xs { padding: 0.25rem 0.55rem; font-size: 0.75rem; }

        /* ── Admin main ── */
        .admin-main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

        /* ── Dashboard cards ── */
        .dash-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem; margin-bottom: 1.5rem;
        }
        .dash-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem;
            transition: 0.2s;
        }
        .dash-card:hover { border-color: var(--border2); background: var(--card-hover); }
        .dash-card .count { font-size: 2.5rem; font-weight: 800; color: var(--gold2); line-height: 1; }
        .dash-card .label { font-size: 0.85rem; color: var(--text2); margin-top: 0.4rem; font-weight: 500; }
        .dash-card .time { font-size: 0.73rem; color: var(--text3); margin-top: 0.3rem; }
        .log-list { max-height: 300px; overflow-y: auto; }
        .log-item {
            padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border);
            color: var(--text2); font-size: 0.84rem; display: flex;
            justify-content: space-between; gap: 1rem;
        }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-time { font-size: 0.73rem; color: var(--text3); white-space: nowrap; }

        /* ── Toolbar ── */
        .toolbar {
            display: flex; gap: 0.6rem; align-items: center;
            margin-bottom: 1rem; flex-wrap: wrap;
        }
        .toolbar .search-input {
            flex: 1; min-width: 200px; padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm); border: 1px solid var(--border2);
            background: var(--card); color: var(--text); font-size: 0.9rem;
            outline: none; font-family: var(--font);
        }
        .toolbar .search-input:focus { border-color: var(--gold); }
        .toolbar .sep { width: 1px; height: 28px; background: var(--border2); margin: 0 0.3rem; }

        /* ── Card-list table (replaces cramped table) ── */
        .card-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .list-item {
            background: var(--card); border: 2px solid var(--border);
            border-radius: var(--radius); padding: 0.85rem 1rem;
            display: flex; align-items: center; gap: 0.85rem;
            transition: 0.15s; cursor: default;
            flex-wrap: wrap;
        }
        .list-item:hover { border-color: var(--border2); background: var(--card-hover); }
        .list-item.selected { border-color: var(--gold); background: var(--gold-bg); }
        .list-check { flex-shrink: 0; }
        .list-check input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--gold); }
        .list-drag {
            flex-shrink: 0; color: var(--text3); cursor: grab; font-size: 1.1rem;
            padding: 0.2rem; user-select: none;
        }
        .list-drag:active { cursor: grabbing; }
        .list-icon {
            flex-shrink: 0; font-size: 1.6rem; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); border-radius: var(--radius-sm);
        }
        .list-info { flex: 1; min-width: 150px; }
        .list-info .name { font-weight: 700; font-size: 0.95rem; color: var(--text); }
        .list-info .meta {
            font-size: 0.78rem; color: var(--text3); margin-top: 0.15rem;
            display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;
        }
        .list-badges { display: flex; gap: 0.35rem; flex-wrap: wrap; flex-shrink: 0; }
        .badge {
            padding: 0.12rem 0.5rem; border-radius: 0.2rem; font-size: 0.72rem;
            font-weight: 600;
        }
        .badge-tag { background: var(--cyan-bg); color: var(--cyan2); border: 1px solid rgba(46,158,196,0.15); }
        .badge-hot { background: rgba(217,67,78,0.1); color: var(--red2); }
        .badge-new { background: rgba(61,163,93,0.1); color: var(--green2); }
        .badge-vid { background: var(--gold-bg); color: var(--gold2); }
        .badge-img { background: rgba(61,163,93,0.08); color: var(--green2); }
        .list-actions {
            display: flex; gap: 0.3rem; flex-shrink: 0;
        }

        /* ── Modals ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(6,8,13,0.8);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 1rem;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border2);
            max-width: 780px; width: 100%; max-height: 88vh; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: var(--card); z-index: 10;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
        .modal-body { padding: 1.5rem; }
        .form-group { margin-bottom: 1.15rem; }
        .form-group label {
            display: block; margin-bottom: 0.35rem; font-weight: 700;
            font-size: 0.84rem; color: var(--text2);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.65rem 0.85rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border2); background: var(--bg);
            color: var(--text); font-size: 0.9rem; outline: none;
            font-family: var(--font); transition: 0.2s;
        }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200,146,42,0.08);
        }
        .form-group .help { font-size: 0.74rem; color: var(--text3); margin-top: 0.25rem; }
        .form-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 0.5rem; }
        .form-row { display: flex; gap: 0.75rem; }
        .form-row .form-group { flex: 1; min-width: 0; }

        /* RTE bar */
        .rte-bar { display: flex; gap: 0.25rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
        .rte-btn {
            padding: 0.35rem 0.65rem; border-radius: var(--radius-sm);
            border: 1px solid var(--border2); background: var(--bg);
            color: var(--text2); cursor: pointer; font-size: 0.8rem;
            font-weight: 600; transition: 0.15s; font-family: var(--font);
        }
        .rte-btn:hover { border-color: var(--cyan); color: var(--cyan2); }
        .rte-btn.vid { border-color: rgba(200,146,42,0.3); color: var(--gold2); }
        .rte-btn.vid:hover { border-color: var(--gold2); }

        /* ── Media grid ── */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
        .media-item {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.5rem; text-align: center;
            transition: 0.15s;
        }
        .media-item:hover { border-color: var(--border2); }
        .media-item img, .media-item video {
            width: 100%; height: 90px; object-fit: cover; border-radius: 0.2rem; cursor: pointer;
        }
        .media-item .fname {
            font-size: 0.68rem; color: var(--text3); margin: 0.3rem 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .empty { text-align: center; padding: 4rem 2rem; color: var(--text3); font-size: 0.95rem; }

        .toast {
            position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
            background: var(--green); color: #fff; padding: 0.6rem 1.5rem;
            border-radius: var(--radius-sm); font-size: 0.85rem; z-index: 9999;
            font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            font-family: var(--font);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .topbar-inner { flex-wrap: wrap; height: auto; padding: 0.6rem 0; }
            .topbar { padding: 0 1rem; }
            .topbar-nav { order: 3; width: 100%; overflow-x: auto; }
            .admin-main { padding: 1rem; }
            .dash-grid { grid-template-columns: 1fr 1fr; }
            .list-item { padding: 0.75rem; }
            .list-actions { width: 100%; justify-content: flex-end; }
            .form-row { flex-direction: column; }
            .toolbar { flex-direction: column; }
            .toolbar .sep { display: none; }
            .media-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <h1>⚔ 管理后台</h1>
            <p class="sub">王者荣耀世界攻略站 · 内容管理</p>
            <input type="text" id="loginUser" placeholder="用户名" autocomplete="username">
            <input type="password" id="loginPass" placeholder="密码" autocomplete="current-password">
            <button class="btn-login" id="loginBtn">登 录</button>
            <p class="login-error" id="loginError"></p>
        </div>
    </div>

    <!-- Admin -->
    <div class="admin-page" id="adminPage">
        <header class="topbar">
            <div class="topbar-inner">
                <span class="topbar-brand">⚔ 王者荣耀世界 · 后台</span>
                <nav class="topbar-nav" id="adminNav">
                    <a data-table="dashboard" class="active">概览</a>
                    <a data-table="pvp_guides">PVP攻略</a>
                    <a data-table="explore_guides">探索攻略</a>
                    <a data-table="codes">兑换码</a>
                    <a data-table="quickref">速查手册</a>
                </nav>
                <div class="topbar-actions">
                    <a href="/" class="btn btn-outline btn-sm">👁 前台</a>
                    <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
                </div>
            </div>
        </header>
        <main class="admin-main">
            <div class="toolbar" id="toolbarRow">
                <input type="text" class="search-input" id="searchAdmin" placeholder="搜索...">
                <span class="sep"></span>
                <button class="btn btn-primary" id="btnAdd">＋ 新建</button>
                <button class="btn btn-outline" id="btnMedia">🖼 媒体库</button>
                <button class="btn btn-outline" id="btnImport">📥 批量导入</button>
                <button class="btn btn-outline" id="btnExport">📤 备份导出</button>
                <button class="btn btn-danger" id="btnBatchDel">🗑 批量删除</button>
            </div>
            <div id="contentWrap"></div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">编辑</h3>
                <button class="btn btn-ghost btn-icon" id="modalClose" style="font-size:1.2rem;">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Media Modal -->
    <div class="modal-overlay" id="mediaModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🖼 媒体库</h3>
                <button class="btn btn-ghost btn-icon" id="mediaModalClose" style="font-size:1.2rem;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>上传图片/视频（拖拽或点击选择）</label>
                    <input type="file" id="mediaFile" accept="image/*,video/*" style="padding:1rem;cursor:pointer;">
                    <div id="mediaUploadStatus" style="font-size:0.84rem;margin-top:0.5rem;"></div>
                </div>
                <div class="media-grid" id="mediaGrid" style="margin-top:1rem;"></div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal-overlay" id="importModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📥 批量导入 <span id="importTableName" style="color:var(--gold2);"></span></h3>
                <button class="btn btn-ghost btn-icon" id="importModalClose" style="font-size:1.2rem;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择 CSV 文件</label>
                    <input type="file" id="importFile" accept=".csv" style="padding:1rem;cursor:pointer;">
                </div>
                <div id="importPreview" style="display:none;margin:1rem 0;">
                    <div id="importPreviewTable" style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-outline" id="btnDownloadTemplate">📋 下载模板</button>
                    <button class="btn btn-primary" id="btnDoImport" style="display:none;">确认导入</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const Q = id => document.getElementById(id);
        const API = '';

        let token = sessionStorage.getItem('admin_token') || '';
        function api(path, opts = {}) {
            const h = { ...(opts.headers || {}) };
            if (token) h['Authorization'] = 'Bearer ' + token;
            if (opts.body && !h['Content-Type']) h['Content-Type'] = 'application/json';
            return fetch(path, { ...opts, headers: h }).then(async r => {
                if (r.status === 401) { token = ''; sessionStorage.removeItem('admin_token'); Q('loginPage').style.display = 'flex'; Q('adminPage').style.display = 'none'; throw new Error('未登录'); }
                if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
                const ct = r.headers.get('content-type') || '';
                return ct.includes('json') ? r.json() : r.text();
            });
        }

        let currentTable = 'dashboard';
        let currentData = [];
        let editingItem = null;
        let selectedIds = new Set();
        let dragRow = null;

        const TABLE_META = {
            pvp_guides: {
                name: 'PVP攻略',
                fields: (() => [
                    { key: 'title', label: '标题', type: 'text', big: true },
                    { key: 'description', label: '简介', type: 'textarea' },
                    { key: 'icon', label: '图标 emoji', type: 'text' },
                    { key: 'image_url', label: '封面图链接', type: 'media' },
                    { key: 'category', label: '分类', type: 'select', options: ['1v1','4v4','general'] },
                    { key: 'tags', label: '标签（逗号分隔）', type: 'text' },
                    { key: 'badge', label: '角标', type: 'select', options: ['','new','hot'] },
                    { key: 'video_url', label: '视频链接', type: 'media' },
                    { key: 'content', label: '攻略内容', type: 'richtext' },
                    { key: 'sort_order', label: '排序权重', type: 'number' },
                ])(),
                nameField: 'title',
                catLabels: { '1v1':'⚔ 1v1竞技', '4v4':'🛡 4v4团队', 'general':'📖 通用技巧' }
            },
            explore_guides: {
                name: '探索攻略',
                fields: (() => [
                    { key: 'title', label: '标题', type: 'text', big: true },
                    { key: 'description', label: '简介', type: 'textarea' },
                    { key: 'icon', label: '图标 emoji', type: 'text' },
                    { key: 'image_url', label: '封面图链接', type: 'media' },
                    { key: 'category', label: '分类', type: 'select', options: ['map','boss','collection','beginner'] },
                    { key: 'tags', label: '标签（逗号分隔）', type: 'text' },
                    { key: 'badge', label: '角标', type: 'select', options: ['','new','hot'] },
                    { key: 'video_url', label: '视频链接', type: 'media' },
                    { key: 'content', label: '攻略内容', type: 'richtext' },
                    { key: 'sort_order', label: '排序权重', type: 'number' },
                ])(),
                nameField: 'title',
                catLabels: { 'map':'🗺 地图探索', 'boss':'👹 BOSS攻略', 'collection':'💎 收集养成', 'beginner':'🌱 新手入门' }
            },
            codes: {
                name: '兑换码',
                fields: [
                    { key: 'code', label: '兑换码', type: 'text', big: true },
                    { key: 'description', label: '说明', type: 'text' },
                    { key: 'reward', label: '奖励内容', type: 'text' },
                    { key: 'expiry', label: '有效期', type: 'text' },
                    { key: 'is_active', label: '状态', type: 'select', options: [1,0] },
                    { key: 'sort_order', label: '排序权重', type: 'number' },
                ],
                nameField: 'code'
            },
            quickref: {
                name: '速查手册',
                fields: [
                    { key: 'title', label: '标题', type: 'text', big: true },
                    { key: 'icon', label: '图标 emoji', type: 'text' },
                    { key: 'items', label: '条目（每行一个）', type: 'items' },
                    { key: 'sort_order', label: '排序权重', type: 'number' },
                ],
                nameField: 'title'
            }
        };

        // ── Helpers ──
        function h(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
        function toast(msg) {
            const t = Q('toast'); t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        // ── Login ──
        Q('loginBtn').addEventListener('click', async () => {
            const u = Q('loginUser').value, p = Q('loginPass').value;
            try {
                const data = await api('/api/admin/login', {
                    method: 'POST',
                    body: JSON.stringify({ username: u, password: p })
                });
                token = data.token;
                sessionStorage.setItem('admin_token', token);
                Q('loginPage').style.display = 'none';
                Q('adminPage').style.display = 'block';
                switchTab('dashboard');
            } catch(e) {
                Q('loginError').textContent = '账号或密码错误';
                Q('loginError').style.display = 'block';
            }
        });
        Q('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') Q('loginBtn').click(); });

        // Auto-check login
        (async () => {
            try {
                const data = await api('/api/admin/check');
                if (data.logged_in) {
                    Q('loginPage').style.display = 'none';
                    Q('adminPage').style.display = 'block';
                    switchTab('dashboard');
                }
            } catch(e) {}
        })();

        Q('logoutBtn').addEventListener('click', async () => {
            token = ''; sessionStorage.removeItem('admin_token');
            Q('loginPage').style.display = 'flex';
            Q('adminPage').style.display = 'none';
        });

        // ── Navigation ──
        Q('adminNav').addEventListener('click', e => {
            if (e.target.tagName === 'A') switchTab(e.target.dataset.table);
        });

        function switchTab(table) {
            currentTable = table;
            selectedIds.clear();
            updateBatchBtn();
            document.querySelectorAll('#adminNav a').forEach(a => a.classList.remove('active'));
            const link = document.querySelector(`#adminNav a[data-table="${table}"]`);
            if (link) link.classList.add('active');
            Q('toolbarRow').style.display = table === 'dashboard' ? 'none' : '';
            Q('searchAdmin').value = '';
            if (table === 'dashboard') loadDashboard();
            else loadTable(table);
        }

        // ── Dashboard ──
        async function loadDashboard() {
            const stats = await api('/api/admin/stats');
            const names = { pvp_guides:'⚔ PVP攻略', explore_guides:'🗺 探索攻略', codes:'🎁 兑换码', quickref:'📋 速查手册' };
            let html = '<div class="dash-grid">';
            ['pvp_guides','explore_guides','codes','quickref'].forEach(t => {
                const s = stats[t] || {};
                html += `<div class="dash-card">
                    <div class="count">${s.count ?? '—'}</div>
                    <div class="label">${names[t]}</div>
                    <div class="time">${s.latest ? s.latest.slice(0,16).replace('T',' ') : '暂无内容'}</div>
                </div>`;
            });
            html += '</div>';
            if (stats.logs && stats.logs.length) {
                html += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;">
                    <h3 style="font-size:0.95rem;font-weight:700;color:var(--text2);margin-bottom:0.75rem;">最近操作</h3>
                    <div class="log-list">
                        ${stats.logs.map(log => `<div class="log-item">
                            <span><strong style="color:var(--text);">${h(log.action)}</strong> ${h(log.detail)}</span>
                            <span class="log-time">${(log.created_at||'').slice(0,16).replace('T',' ')}</span>
                        </div>`).join('')}
                    </div></div>`;
            }
            Q('contentWrap').innerHTML = html;
        }

        // ── Table → Card List ──
        async function loadTable(table) {
            currentData = await api(`/api/admin/data/${table}`);
            renderCardList();
        }

        function renderCardList() {
            const meta = TABLE_META[currentTable];
            if (!meta) return;
            const q = Q('searchAdmin').value.toLowerCase();
            let rows = currentData;
            if (q) {
                rows = rows.filter(item => {
                    return ['title','code','name','description','content'].some(k => {
                        const v = item[k];
                        if (Array.isArray(v)) return v.some(x => String(x).toLowerCase().includes(q));
                        return String(v ?? '').toLowerCase().includes(q);
                    });
                });
            }

            if (!rows.length) {
                Q('contentWrap').innerHTML = '<div class="empty">没有匹配的内容</div>';
                return;
            }

            // Select all checkbox
            let html = `<div style="margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;">
                <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;color:var(--text2);font-size:0.84rem;font-weight:600;">
                    <input type="checkbox" id="selectAll" style="width:18px;height:18px;accent-color:var(--gold);"> 全选
                </label>
                <span style="color:var(--text3);font-size:0.8rem;">共 ${rows.length} 条</span>
            </div>`;

            html += '<div class="card-list">';
            rows.forEach((item, idx) => {
                const id = item.id;
                const name = item.title || item.code || item.name || '未命名';
                const desc = (item.description || '').replace(/<[^>]*>/g, '').substring(0, 80);
                const icon = item.icon || '📖';
                const badge = item.badge;
                const tags = Array.isArray(item.tags) ? item.tags.slice(0,3) : [];
                const videoUrl = item.video_url || '';
                const imageUrl = item.image_url || '';
                const cat = meta.catLabels ? (meta.catLabels[item.category] || item.category || '') : '';
                const isActive = item.is_active;
                const isSelected = selectedIds.has(id);

                html += `<div class="list-item${isSelected ? ' selected' : ''}" data-id="${id}" draggable="true">
                    <div class="list-check"><input type="checkbox" class="row-cb" data-id="${id}" ${isSelected ? 'checked' : ''}></div>
                    <div class="list-drag">⋮⋮</div>
                    <div class="list-icon">${icon}</div>
                    <div class="list-info">
                        <div class="name">${h(name)}</div>
                        <div class="meta">
                            ${cat ? `<span>${cat}</span>` : ''}
                            ${isActive !== undefined ? `<span style="color:${isActive?'var(--green2)':'var(--red2)'};">${isActive ? '启用' : '禁用'}</span>` : ''}
                            ${desc ? `<span style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h(desc)}</span>` : ''}
                        </div>
                    </div>
                    <div class="list-badges">
                        ${badge === 'new' ? '<span class="badge badge-new">最新</span>' : ''}
                        ${badge === 'hot' ? '<span class="badge badge-hot">热门</span>' : ''}
                        ${imageUrl ? '<span class="badge badge-img">🖼</span>' : ''}
                        ${videoUrl ? '<span class="badge badge-vid">▶ 视频</span>' : ''}
                        ${tags.map(t => `<span class="badge badge-tag">${h(t)}</span>`).join('')}
                    </div>
                    <div class="list-actions">
                        <button class="btn btn-ghost btn-xs" data-action="edit" data-id="${id}">编辑</button>
                        <button class="btn btn-ghost btn-xs" data-action="dup" data-id="${id}">复制</button>
                        <button class="btn btn-danger btn-xs" data-action="del" data-id="${id}">删除</button>
                    </div>
                </div>`;
            });
            html += '</div>';
            Q('contentWrap').innerHTML = html;
            bindCardListEvents();
        }

        function bindCardListEvents() {
            // Select all
            const selAll = Q('selectAll');
            if (selAll) {
                selAll.addEventListener('change', function() {
                    const cbs = document.querySelectorAll('.row-cb');
                    if (this.checked) cbs.forEach(cb => { cb.checked = true; selectedIds.add(parseInt(cb.dataset.id)); });
                    else cbs.forEach(cb => { cb.checked = false; selectedIds.delete(parseInt(cb.dataset.id)); });
                    updateListSelection();
                    updateBatchBtn();
                });
            }

            // Individual checkboxes
            document.querySelectorAll('.row-cb').forEach(cb => {
                cb.addEventListener('change', function() {
                    const id = parseInt(this.dataset.id);
                    if (this.checked) selectedIds.add(id); else selectedIds.delete(id);
                    updateListSelection();
                    updateBatchBtn();
                });
            });

            // Actions
            Q('contentWrap').addEventListener('click', async e => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                const action = btn.dataset.action;
                if (action === 'edit') openEditModal(id);
                else if (action === 'dup') { await api(`/api/admin/${currentTable}/${id}/duplicate`, { method: 'POST' }); await loadTable(currentTable); toast('已复制'); }
                else if (action === 'del') {
                    if (!confirm('删除后不可恢复，确认？')) return;
                    await api(`/api/admin/${currentTable}/${id}`, { method: 'DELETE' });
                    await loadTable(currentTable); toast('已删除');
                }
            });

            // Drag sort
            document.querySelectorAll('.list-item[draggable]').forEach(row => {
                row.addEventListener('dragstart', function(e) {
                    dragRow = this; this.style.opacity = '0.4';
                    e.dataTransfer.effectAllowed = 'move';
                });
                row.addEventListener('dragend', function() { this.style.opacity = ''; });
                row.addEventListener('dragover', function(e) {
                    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                    this.style.borderTop = '2px solid var(--gold)';
                });
                row.addEventListener('dragleave', function() { this.style.borderTop = ''; });
                row.addEventListener('drop', async function(e) {
                    e.preventDefault(); this.style.borderTop = '';
                    if (this === dragRow) return;
                    const items = [...document.querySelectorAll('.list-item[draggable]')];
                    const fromIdx = items.indexOf(dragRow);
                    const toIdx = items.indexOf(this);
                    const moved = currentData.splice(fromIdx, 1)[0];
                    currentData.splice(toIdx, 0, moved);
                    const payload = currentData.map((r, i) => ({ id: r.id, sort_order: i }));
                    await api(`/api/admin/${currentTable}/sort`, {
                        method: 'POST',
                        body: JSON.stringify({ items: payload })
                    });
                    renderCardList();
                });
            });
        }

        function updateListSelection() {
            document.querySelectorAll('.list-item').forEach(item => {
                const id = parseInt(item.dataset.id);
                item.classList.toggle('selected', selectedIds.has(id));
            });
        }

        function updateBatchBtn() {
            Q('btnBatchDel').textContent = selectedIds.size ? `🗑 删除(${selectedIds.size})` : '🗑 批量删除';
        }

        // ── Edit Modal ──
        Q('modalClose').addEventListener('click', closeEditModal);
        Q('editModal').addEventListener('click', e => { if (e.target === Q('editModal')) closeEditModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });

        function openEditModal(id) {
            const meta = TABLE_META[currentTable];
            editingItem = id;
            Q('modalTitle').textContent = id ? `编辑 ${meta.name}` : `新建 ${meta.name}`;

            let item = {};
            if (id) item = currentData.find(d => d.id === id) || {};

            let html = '';
            meta.fields.forEach(f => {
                let val = item[f.key] ?? '';
                if (f.key === 'tags' && Array.isArray(val)) val = val.join(', ');
                if (f.key === 'items' && Array.isArray(val)) val = val.join('\n');

                html += '<div class="form-group">';
                html += `<label>${f.label}</label>`;

                if (f.type === 'richtext') {
                    html += `<div class="rte-bar">
                        <button class="rte-btn" data-rte="h3" title="标题"><b>H</b></button>
                        <button class="rte-btn" data-rte="strong" title="加粗"><b>B</b></button>
                        <button class="rte-btn" data-rte="p" title="段落">¶</button>
                        <button class="rte-btn" data-rte="ul" title="无序列表">☰</button>
                        <button class="rte-btn vid" data-rte="video" title="插入视频">▶ 插入视频</button>
                    </div>`;
                    html += `<textarea name="${f.key}" id="rte_${f.key}" rows="14">${h(String(val))}</textarea>`;
                } else if (f.type === 'textarea') {
                    html += `<textarea name="${f.key}" rows="4">${h(String(val))}</textarea>`;
                } else if (f.type === 'items') {
                    html += `<textarea name="${f.key}" rows="6">${h(String(val))}</textarea>`;
                    html += '<div class="help">每行一个条目</div>';
                } else if (f.type === 'media') {
                    html += `<div style="display:flex;gap:0.4rem;"><input type="text" name="${f.key}" value="${h(String(val))}" placeholder="粘贴链接" style="flex:1;"><button type="button" class="btn btn-outline btn-sm" onclick="openMediaForField('${f.key}')">📁 选文件</button></div>`;
                    html += '<div class="help">粘贴直链，或点击"选文件"从媒体库选择</div>';
                } else if (f.type === 'select') {
                    html += '<select name="' + f.key + '" style="font-size:0.95rem;">';
                    f.options.forEach(opt => {
                        const sel = String(val) === String(opt) ? ' selected' : '';
                        let label = opt;
                        if (f.key === 'category' && meta.catLabels) label = meta.catLabels[opt] || opt;
                        if (f.key === 'badge') label = opt === '' ? '(无)' : opt === 'new' ? '🆕 最新' : '🔥 热门';
                        if (f.key === 'is_active') label = opt == 1 ? '✅ 启用' : '❌ 禁用';
                        html += `<option value="${opt}"${sel}>${label}</option>`;
                    });
                    html += '</select>';
                } else if (f.key === 'sort_order') {
                    html += `<input type="number" name="${f.key}" value="${val || 0}" min="0" style="max-width:120px;">`;
                } else {
                    const t = f.big ? ' style="font-size:1rem;font-weight:600;"' : '';
                    html += `<input type="${f.type}" name="${f.key}" value="${h(String(val))}"${t}>`;
                }
                html += '</div>';
            });

            html += '<div class="form-actions">';
            html += `<button class="btn btn-outline" onclick="closeEditModal()">取消</button>`;
            html += `<button class="btn btn-primary" onclick="saveItem()" style="min-width:100px;">💾 保存</button>`;
            html += '</div>';

            Q('modalBody').innerHTML = html;
            Q('editModal').classList.add('active');

            // RTE
            Q('modalBody').querySelectorAll('.rte-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tag = this.dataset.rte;
                    if (tag === 'video') {
                        const url = prompt('视频链接（YouTube / B站 / .mp4 直链 / 嵌入地址）：');
                        if (!url) return;
                        const ta = this.closest('.form-group').querySelector('textarea');
                        let embed;
                        const ytM = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
                        const biM = url.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
                        if (ytM) embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="https://www.youtube.com/embed/${ytM[1]}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        else if (biM) embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="https://player.bilibili.com/player.html?bvid=${biM[1]}&page=1" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        else if (url.match(/\.(mp4|webm|mov)/i)) embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><video controls src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;"></video></div>`;
                        else embed = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:0.4rem;margin:1rem 0;"><iframe src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                        const s = ta.selectionStart;
                        ta.value = ta.value.substring(0, s) + '\n' + embed + '\n' + ta.value.substring(ta.selectionEnd);
                        ta.focus();
                        return;
                    }
                    const ta = this.closest('.form-group').querySelector('textarea');
                    const s = ta.selectionStart, e = ta.selectionEnd;
                    const sel = ta.value.substring(s, e) || '';
                    const wraps = { h3:['<h3>','</h3>'], strong:['<strong>','</strong>'], p:['<p>','</p>'], ul:['<ul>\n  ','\n</ul>'], li:['<li>','</li>'] };
                    const w = wraps[tag];
                    if (w) { ta.value = ta.value.substring(0,s) + w[0] + sel + w[1] + ta.value.substring(e); ta.focus(); }
                });
            });
        }

        function closeEditModal() { Q('editModal').classList.remove('active'); editingItem = null; }

        async function saveItem() {
            const meta = TABLE_META[currentTable];
            const data = {};
            meta.fields.forEach(f => {
                const el = Q('modalBody').querySelector(`[name="${f.key}"]`);
                if (!el) return;
                let val = el.value;
                if (f.key === 'tags') val = val ? val.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
                else if (f.key === 'items') val = val ? val.split('\n').map(s => s.trim()).filter(Boolean) : [];
                else if (['sort_order','is_active'].includes(f.key)) val = Number(val) || 0;
                data[f.key] = val;
            });

            const url = editingItem
                ? `/api/admin/${currentTable}/${editingItem}`
                : `/api/admin/${currentTable}`;
            try {
                await api(url, { method: editingItem ? 'PUT' : 'POST', body: JSON.stringify(data) });
                closeEditModal(); await loadTable(currentTable); toast(editingItem ? '已保存' : '已创建');
            } catch(e) { toast('保存失败'); }
        }

        // ── Batch Delete ──
        Q('btnBatchDel').addEventListener('click', async () => {
            if (!selectedIds.size) return toast('请先选择要删除的内容');
            if (!confirm(`确认永久删除 ${selectedIds.size} 条数据？`)) return;
            await api('/api/admin/batch-delete', {
                method: 'POST',
                body: JSON.stringify({ table: currentTable, ids: [...selectedIds] })
            });
            selectedIds.clear();
            updateBatchBtn();
            await loadTable(currentTable);
            toast('已批量删除');
        });

        // ── Import ──
        const importModal = Q('importModal');
        Q('btnImport').addEventListener('click', () => {
            Q('importTableName').textContent = TABLE_META[currentTable].name;
            importModal.classList.add('active');
        });
        ['importModalClose','importCancel'].forEach(id => {
            Q(id) && Q(id).addEventListener('click', () => importModal.classList.remove('active'));
        });
        importModal.addEventListener('click', e => { if (e.target === importModal) importModal.classList.remove('active'); });

        Q('btnDownloadTemplate').addEventListener('click', () => {
            window.open(`/api/admin/template/${currentTable}`, '_blank');
        });

        Q('importFile').addEventListener('change', async function() {
            const file = this.files[0]; if (!file) return;
            const text = await file.text();
            const lines = text.trim().split('\n').filter(l => l.trim());
            if (lines.length < 2) { Q('importPreview').style.display = 'none'; Q('btnDoImport').style.display = 'none'; return; }
            const headers = parseCSVLine(lines[0]);
            const rows = [];
            for (let i = 1; i < Math.min(lines.length, 10); i++) rows.push(parseCSVLine(lines[i]));
            let thtml = '<table style="font-size:0.76rem;width:100%;">';
            thtml += '<thead><tr>' + headers.map(hdr => `<th style="padding:0.35rem;">${hdr}</th>`).join('') + '</tr></thead>';
            thtml += '<tbody>' + rows.map(r => '<tr>' + headers.map(hdr => `<td style="padding:0.35rem;color:var(--text2);">${h(r[hdr]||'—')}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
            if (lines.length > 10) thtml += `<p style="color:var(--text3);font-size:0.78rem;margin-top:0.5rem;">...共 ${lines.length - 1} 条数据</p>`;
            Q('importPreviewTable').innerHTML = thtml;
            Q('importPreview').style.display = 'block';
            Q('btnDoImport').style.display = 'inline-flex';
        });

        Q('btnDoImport').addEventListener('click', async () => {
            const file = Q('importFile').files[0]; if (!file) return;
            const btn = Q('btnDoImport');
            btn.disabled = true; btn.textContent = '导入中...';
            const fd = new FormData(); fd.append('file', file); fd.append('table', currentTable);
            try {
                const r = await api('/api/admin/import', { method: 'POST', body: fd });
                if (r.success) {
                    toast(`导入完成：${r.inserted} 条`);
                    importModal.classList.remove('active');
                    await loadTable(currentTable);
                } else {
                    toast('导入失败：' + (r.error || '未知错误'));
                }
            } catch(e) { toast('导入失败'); }
            btn.disabled = false; btn.textContent = '确认导入';
        });

        function parseCSVLine(line) {
            const r = []; let c = '', q = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (q) { if (ch === '"') { if (i+1<line.length && line[i+1]==='"') { c += '"'; i++; } else q = false; } else c += ch; }
                else { if (ch === '"') q = true; else if (ch === ',') { r.push(c.trim()); c = ''; } else c += ch; }
            }
            r.push(c.trim()); return r;
        }

        // ── Media ──
        const mediaModal = Q('mediaModal'), mediaGrid = Q('mediaGrid');
        let mediaTargetField = null;

        Q('btnMedia').addEventListener('click', () => { mediaTargetField = null; mediaModal.classList.add('active'); loadMedia(); });
        Q('mediaModalClose').addEventListener('click', () => mediaModal.classList.remove('active'));
        mediaModal.addEventListener('click', e => { if (e.target === mediaModal) mediaModal.classList.remove('active'); });

        function openMediaForField(fieldName) { mediaTargetField = fieldName; mediaModal.classList.add('active'); loadMedia(); }

        async function loadMedia() {
            const files = await api('/api/admin/media');
            if (!files.length) { mediaGrid.innerHTML = '<p style="color:var(--text3);">暂无文件，上传后出现</p>'; return; }
            mediaGrid.innerHTML = files.map(f => `
                <div class="media-item">
                    ${f.type === 'image'
                        ? `<img src="${f.url}" onclick="pickMedia('${f.url.replace(/'/g,"\\'")}')" title="点击选择此文件">`
                        : `<video src="${f.url}" onclick="pickMedia('${f.url.replace(/'/g,"\\'")}')" title="点击选择此文件"></video>`
                    }
                    <div class="fname">${f.filename.substring(0,16)}</div>
                    <div style="display:flex;gap:0.2rem;justify-content:center;">
                        <button class="btn btn-ghost btn-xs" onclick="pickMedia('${f.url.replace(/'/g,"\\'")}')">选择</button>
                        <button class="btn btn-danger btn-xs" onclick="deleteMedia('${f.filename}')">删</button>
                    </div>
                </div>
            `).join('');
        }

        function pickMedia(url) {
            if (mediaTargetField) {
                const input = Q('modalBody').querySelector(`[name="${mediaTargetField}"]`);
                if (input) { input.value = url; Q('mediaUploadStatus').innerHTML = '已填入：' + url; mediaModal.classList.remove('active'); return; }
            }
            navigator.clipboard.writeText(url).then(() => toast('已复制链接'));
        }

        async function deleteMedia(filename) {
            if (!confirm('删除此文件？')) return;
            await api(`/api/admin/media/${filename}`, { method: 'DELETE' });
            await loadMedia();
        }

        Q('mediaFile').addEventListener('change', async function() {
            const file = this.files[0]; if (!file) return;
            Q('mediaUploadStatus').innerHTML = '⏳ 上传中...';
            const fd = new FormData(); fd.append('file', file);
            try {
                const data = await api('/api/admin/upload', { method: 'POST', body: fd });
                if (data.success) {
                    Q('mediaUploadStatus').innerHTML = `✅ 上传成功`;
                    this.value = '';
                    await loadMedia();
                } else {
                    Q('mediaUploadStatus').innerHTML = '❌ ' + (data.error || '失败');
                }
            } catch(e) { Q('mediaUploadStatus').innerHTML = '上传失败'; }
        });

        // ── Export ──
        Q('btnExport').addEventListener('click', async () => {
            const data = await api('/api/admin/export');
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `wzry_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            toast('备份已下载');
        });

        Q('searchAdmin').addEventListener('input', () => {
            if (currentTable !== 'dashboard') renderCardList();
        });

        Q('btnAdd').addEventListener('click', () => openEditModal(null));
    </script>
</body>
</html>
