<div class="hero-banner" id="heroCarousel">
  {% for item in items %}
  <div class="hero-slide {% if loop.first %}active{% endif %}" data-index="{{ loop.index0 }}">
    <div class="hero-icon">{{ item.icon or '⚔' }}</div>
    <div class="hero-info">
      <h2>
        <span>{{ item.title }}</span>
        {% if item.badge %}
        <span class="hero-badge {{ item.badge }}">{{ item.badge|upper }}</span>
        {% endif %}
      </h2>
      <div class="sub">{{ item.description }}</div>
    </div>
  </div>
  {% endfor %}
  <div class="hero-dots">
    {% for item in items %}
    <div class="hero-dot {% if loop.first %}active{% endif %}" data-target="{{ loop.index0 }}"></div>
    {% endfor %}
  </div>
</div>
{% if items|length > 1 %}
<script>
(function(){
  var slides = document.querySelectorAll('#heroCarousel .hero-slide');
  var dots = document.querySelectorAll('#heroCarousel .hero-dot');
  if (!slides.length) return;
  var current = 0;
  function goTo(idx) {
    slides.forEach(function(s,i){ s.classList.toggle('active', i===idx); });
    dots.forEach(function(d,i){ d.classList.toggle('active', i===idx); });
    current = idx;
  }
  dots.forEach(function(d){ d.addEventListener('click', function(){ goTo(parseInt(this.getAttribute('data-target'))); }); });
  setInterval(function(){ goTo((current+1) % slides.length); }, 5000);
})();
</script>
{% endif %}
